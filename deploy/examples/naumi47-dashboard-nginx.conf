
map "$http_referer|$cookie_nv_user|$cookie_wb_session" $naumi47_compat_api {
 default http://127.0.0.1:13053;
 ~^https?://47\.105\.59\.142/(legacy-workbench/[^|]*|(workbench|single|chat-image|login|admin)(\?[^|]*)?)\| http://127.0.0.1:17847;
 ~^https?://47\.105\.59\.142/(\?[^|]*)?\| http://127.0.0.1:13053;
 ~^[^|]*\|[^|]+\| http://127.0.0.1:13053;
 ~^[^|]*\|\|.+$ http://127.0.0.1:17847;
}
map "$cookie_nv_user|$cookie_wb_session" $naumi47_compat_page {
 default 0;
 ~^[^|]+\| 0;
 ~^\|.+$ 1;
}

server {
 listen 80; server_name 47.105.59.142;
 location /.well-known/acme-challenge/ { root /opt/reference-workbench/acme; }
 location / { return 308 https://$host$request_uri; }
}
server {
 listen 443 ssl; server_name 47.105.59.142;
 ssl_certificate /etc/letsencrypt-reference-workbench/live/47.105.59.142/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt-reference-workbench/live/47.105.59.142/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 310m;
location = /workbench { if ($naumi47_compat_page = 1) { return 418; } error_page 418 = @old_workbench_page; return 302 /batchshot/native/workbench; }
location = /single { if ($naumi47_compat_page = 1) { return 418; } error_page 418 = @old_workbench_page; return 302 /batchshot/native/single; }
location = /chat-image { if ($naumi47_compat_page = 1) { return 418; } error_page 418 = @old_workbench_page; return 302 /batchshot/native/chat-image; }
location @old_workbench_page { proxy_pass http://127.0.0.1:17847; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
 location = /login { if ($naumi47_compat_page = 1) { return 418; } error_page 418 = @old_workbench_page; return 302 /sign-in; }
 location = /admin { if ($naumi47_compat_page = 1) { return 418; } error_page 418 = @old_workbench_page; proxy_pass http://127.0.0.1:13053; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
 location = /health { proxy_pass http://127.0.0.1:13053/api/health; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
 location ^~ /legacy-workbench/ { rewrite ^/legacy-workbench/(.*)$ /$1 break; proxy_pass http://127.0.0.1:17847; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
 location = /workbench-history.js { proxy_pass http://127.0.0.1:17847; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
 location = /workbench-zip.js { proxy_pass http://127.0.0.1:17847; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
 location ^~ /api/reference-workbench/ { proxy_pass http://127.0.0.1:13053; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
location ~ ^/api/(auth/(login|logout|status)|heartbeat|settings|image|images-zip|status|workbench/|single/|chat-image/) { proxy_pass $naumi47_compat_api$request_uri; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
 location = / { return 302 /dashboard$is_args$args; }
 location / { proxy_pass http://127.0.0.1:13053; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Connection ""; proxy_cookie_flags nv_user secure; proxy_cookie_flags nv_admin secure; proxy_cookie_flags wb_session secure; proxy_buffering off; proxy_read_timeout 1900s; proxy_send_timeout 1900s; }
}
