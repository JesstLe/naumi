# Opt-in overlay. The local-only baseline stays unchanged until live OSS checks
# and the quiesced full-copy gate pass. New DB/Router/media isolation is retained.
services:
  app:
    environment:
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${NAUMI_OSS_ENDPOINT:?Dedicated staging OSS endpoint required}
      S3_REGION: ${NAUMI_OSS_REGION:?OSS region required}
      S3_ACCESS_KEY_ID: ${NAUMI_OSS_ACCESS_KEY_ID:?Dedicated staging access key required}
      S3_SECRET_ACCESS_KEY: ${NAUMI_OSS_SECRET_ACCESS_KEY:?Dedicated staging secret required}
      S3_BUCKET: ${NAUMI_OSS_BUCKET:?Dedicated staging OSS bucket required}
      S3_FORCE_PATH_STYLE: "false"
      S3_PUBLIC_BASE_URL: ""
