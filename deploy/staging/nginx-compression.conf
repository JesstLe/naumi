# Installed on 47 as /etc/nginx/conf.d/naumi47-compression.conf (http context).
# /etc/nginx/nginx.conf already sets `gzip on;` but leaves gzip_proxied off and
# gzip_types at the text/html default, and Next.js compresses rendered HTML only:
# App Router JSON and RSC (text/x-component) responses reached browsers
# uncompressed (2026-11-06: /api/account 2.1GB/day, /enterprise RSC 855MB/day).
# Measured on live responses with level 5: release notes 30019 -> 10883 bytes,
# templates 11956 -> 3272 bytes.
#
# text/event-stream and application/x-ndjson are deliberately absent: streams
# (collaboration events, workflow import) must reach the client unbuffered.
# Install inside a release session holding the deploy locks; `nginx -t` then a
# graceful reload. Rollback: delete the file, `nginx -t`, reload.
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json text/x-component text/plain text/css application/javascript text/javascript image/svg+xml;
