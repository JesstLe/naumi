# Staging only. Copy to /opt/naumi-staging/config/docker-compose.yml.
# Always supply the protected env file with --env-file and absolute env-file path.
name: naumi-staging
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naumi_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Independent staging DB password required}
      POSTGRES_DB: ${POSTGRES_DB:-naumi_staging}
    volumes:
      - /opt/naumi-staging/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: ${NAUMI_IMAGE:?Fixed 40-character commit image required}
    restart: unless-stopped
    env_file:
      - ${NAUMI_STAGING_ENV_FILE:?Absolute protected staging env path required}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-naumi_staging}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-naumi_staging}?sslmode=disable
      SETTINGS_SECRET: ${SETTINGS_SECRET:?Preserve source encryption secret privately}
      STORAGE_DRIVER: local
      MEDIA_DIR: /data/media
      S3_ENDPOINT: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_BUCKET: ""
      S3_PUBLIC_BASE_URL: ""
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET: ""
      R2_PUBLIC_BASE_URL: ""
      INTERNAL_APP_ORIGIN: http://127.0.0.1:3000
      NAUMI_VIDEO_WORKER: "0"
      NAUMI_ENVIRONMENT: staging
      NAUMI_STAGING_HISTORY_GUARD: "1"
      VIDEO_WORKER_SECRET: ${VIDEO_WORKER_SECRET:?Independent staging worker secret required}
    ports:
      - "127.0.0.1:13012:3000"
    volumes:
      - /opt/naumi-staging/data/media:/data/media
    depends_on:
      db:
        condition: service_healthy
  video-worker:
    profiles: [workers]
    image: ${NAUMI_IMAGE:?Fixed 40-character commit image required}
    restart: unless-stopped
    command: ["node", "scripts/video-worker.mjs"]
    environment:
      NAUMI_APP_ORIGIN: http://app:3000
      VIDEO_WORKER_SECRET: ${VIDEO_WORKER_SECRET:?}
      VIDEO_WORKER_INTERVAL_MS: ${VIDEO_WORKER_INTERVAL_MS:-15000}
    depends_on:
      app:
        condition: service_started
