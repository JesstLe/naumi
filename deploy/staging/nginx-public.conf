user www-data;
worker_processes auto;
pid /run/naumi-staging-public/nginx.pid;
error_log stderr warn;

events { worker_connections 1024; }

http {
    include /usr/local/lib/naumi-staging-web/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /var/lib/naumi-staging-web/client_body;
    proxy_temp_path /var/lib/naumi-staging-web/proxy;
    fastcgi_temp_path /var/lib/naumi-staging-web/fastcgi;
    uwsgi_temp_path /var/lib/naumi-staging-web/uwsgi;
    scgi_temp_path /var/lib/naumi-staging-web/scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        server_name 120.27.162.85 _;
        client_max_body_size 64m;

        # Only internal workers call this via the existing private app endpoint.
        location ^~ /api/video/worker/ { return 403; }
        location ~ /\. { return 404; }

        location / {
            proxy_pass http://127.0.0.1:13012;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 15s;
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;
            proxy_buffering off;
        }
    }
}
