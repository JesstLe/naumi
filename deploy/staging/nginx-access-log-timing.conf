# Naumi 47: request timing in the access log (http level, /etc/nginx/nginx.conf).
# log_format must precede the access_log that uses it, so this is applied by
# replacing the single default line
#     access_log /var/log/nginx/access.log;
# with the two lines below (backup kept, then `nginx -t` and reload). A conf.d
# include would add a second access_log at the same level and log every line twice.
# The combined prefix is unchanged, so existing log parsers keep working.
log_format naumi_timing '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
access_log /var/log/nginx/access.log naumi_timing;
