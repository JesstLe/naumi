# Naumi — one-command self-host: app + bundled Postgres + persistent volumes.
#   git clone https://github.com/JesstLe/naumi && cd naumi && docker compose up -d
# Then open http://<server-ip> — the first-run wizard walks you through setup
# (OpenAI API Key, optional Pro License Key, site name). No code edits needed.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naumi}
      # ⚠️ Change this password for any internet-facing deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naumi}
      POSTGRES_DB: ${POSTGRES_DB:-naumi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naumi} -d ${POSTGRES_DB:-naumi}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_BRAND_NAME: Naumi
        NEXT_PUBLIC_BRAND_EMAIL: admin@admin.com
    image: ghcr.io/jesstle/naumi:latest
    restart: unless-stopped
    ports:
      # Naumi 实例固定走 3012 端口(http://localhost:3012)。
      # 若 80 已被占用(如装了宝塔/nginx),设 HTTP_PORT=8080 后重跑即可。
      - "${HTTP_PORT:-3012}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://naumi:naumi@db:5432/naumi?sslmode=disable}
      # 大陆服务器连不上 api.openai.com 时,设为任意 OpenAI 兼容中转地址即可。
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_MODELS: ${OPENAI_IMAGE_MODELS:-}
      NEW_API_IMAGE_BASE_URL: ${NEW_API_IMAGE_BASE_URL:-}
      NEW_API_IMAGE_API_KEY: ${NEW_API_IMAGE_API_KEY:-}
      NEW_API_IMAGE_MODELS: ${NEW_API_IMAGE_MODELS:-}
      # Pi Agent 文本/视觉模型可使用独立的 OpenAI 兼容通道，不影响图片生成配置。
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-qwen3.8-flash}
      # 文字模型目录白名单与对外假名映射(设白名单后目录只显示清单,别名翻译回真实 id)
      TEXT_MODEL_WHITELIST: ${TEXT_MODEL_WHITELIST:-}
      TEXT_MODEL_ALIASES: ${TEXT_MODEL_ALIASES:-}
      PADDLE_OCR_BASE_URL: ${PADDLE_OCR_BASE_URL:-}
      PADDLE_OCR_API_KEY: ${PADDLE_OCR_API_KEY:-}
      PADDLE_OCR_REQUIRED: ${PADDLE_OCR_REQUIRED:-false}
      PADDLE_OCR_FALLBACK_MODEL: ${PADDLE_OCR_FALLBACK_MODEL:-}
      PADDLE_OCR_TIMEOUT_MS: ${PADDLE_OCR_TIMEOUT_MS:-35000}
      PADDLE_OCR_MAX_ATTEMPTS: ${PADDLE_OCR_MAX_ATTEMPTS:-2}
      PADDLE_OCR_MIN_CONFIDENCE: ${PADDLE_OCR_MIN_CONFIDENCE:-0.12}
      YUTANG_API_BASE: ${YUTANG_API_BASE:-http://host.docker.internal:8766}
      YUTANG_USER: ${YUTANG_USER:-h13365319844}
      YUTANG_PASS: ${YUTANG_PASS:-renda2026}
      AGENT_VISION_MODEL: ${AGENT_VISION_MODEL:-qwen3.8-flash}
      # 只影响竞品/爆款参考图反推；image 复用生图通道，不改全局 Agent。
      REFERENCE_VISION_SOURCE: ${REFERENCE_VISION_SOURCE:-agent}
      REFERENCE_VISION_MODEL: ${REFERENCE_VISION_MODEL:-}
      # Agent 底座选择: pi(默认,支持插话) / codex(经 MCP 挂业务工具)
      AGENT_BACKEND: ${AGENT_BACKEND:-pi}
      # AES key for encrypting stored API keys at rest.
      # ⚠️ Set a long random value BEFORE first run and never change it afterwards.
      SETTINGS_SECRET: ${SETTINGS_SECRET:?请先运行安装器或配置独立随机 SETTINGS_SECRET}
      # Filesystem / R2 / S3-compatible (Garage、MinIO、OSS、COS) storage.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MEDIA_DIR: /data/media
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # 自托管 Pro 版(edition.ts 的 license 校验已改为离线通过,不连作者服务器)
      # 开放本地邮箱+密码注册(原生多用户模式)
      NAUMI_MULTI_USER: "1"
      # 内测默认隐藏价格、充值、购买与公开销售页；正式开放时设为 1。
      NAUMI_PUBLIC_COMMERCE: ${NAUMI_PUBLIC_COMMERCE:-0}
      # 内测同事可查看积分方案；质量参数开关独立控制，不改变正式充值/扣费标准。
      NAUMI_BETA_PREVIEW: ${NAUMI_BETA_PREVIEW:-0}
      NAUMI_IMAGE_QUALITY_SUPPORTED: ${NAUMI_IMAGE_QUALITY_SUPPORTED:-0}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      # Agent 工具内部回环调用地址(容器内 app 自身,端口是容器端口非宿主映射)
      INTERNAL_APP_ORIGIN: http://127.0.0.1:3000
      # 外置视频 worker 通过内部鉴权端点驱动恢复，app 内不再启动定时器。
      NAUMI_VIDEO_WORKER: "0"
      VIDEO_WORKER_SECRET: ${VIDEO_WORKER_SECRET:?请配置独立随机 VIDEO_WORKER_SECRET}
      VIDEO_API_BASE_URL: ${VIDEO_API_BASE_URL:-}
      VIDEO_API_KEY: ${VIDEO_API_KEY:-}
      VIDEO_API_MODEL: ${VIDEO_API_MODEL:-}
      VIDEO_API_MODELS: ${VIDEO_API_MODELS:-}
      VIDEO_PROVIDERS_JSON: ${VIDEO_PROVIDERS_JSON:-}
      # Optional: Pro license (or enter it in the first-run wizard instead)
    extra_hosts:
      # 宿主机服务(鱼塘 8766)从容器内访问走 host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  video-worker:
    image: ghcr.io/jesstle/naumi:latest
    restart: unless-stopped
    command: ["node", "scripts/video-worker.mjs"]
    environment:
      NAUMI_APP_ORIGIN: http://app:3000
      VIDEO_WORKER_SECRET: ${VIDEO_WORKER_SECRET:?请配置独立随机 VIDEO_WORKER_SECRET}
      VIDEO_WORKER_INTERVAL_MS: ${VIDEO_WORKER_INTERVAL_MS:-15000}
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  appdata:
