# Optional mainland registry mirror. Copy already-built immutable images; never rebuild them.
name: Push image to Aliyun ACR (CN mirror)
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已完成GitHub镜像工作流的codex-image-* Release'
        type: string
        required: true
      source_commit:
        description: '明确选择的40位提交SHA'
        type: string
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: acr-mirror-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  acr:
    if: github.repository == 'JesstLe/naumi' && vars.ACR_IMAGE != '' && vars.ACR_REGISTRY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Fetch verified fixed image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_commit }}
        run: |
          python3 scripts/github-release-manifest.py fetch --tag "$RELEASE_TAG" --expected-sha "$SOURCE_SHA" --directory candidate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Mirror existing image digests
        env:
          ACR_IMAGE: ${{ vars.ACR_IMAGE }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          record=json.load(open('candidate/release-manifest.json'))
          for flavor,row in record['images'].items():
              suffix='' if flavor=='ui' else '-'+flavor
              destination=os.environ['ACR_IMAGE']+':'+record['sourceCommit']+suffix
              subprocess.run(['docker','buildx','imagetools','create','--tag',destination,row['reference']],check=True)
          PY
