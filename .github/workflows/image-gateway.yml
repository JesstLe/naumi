name: Image gateway regression
on:
  push:
    branches: [main, codex/credits-handoff]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/image-gateway.yml'
  pull_request:
    paths:
      - 'src/lib/billing/**'
      - 'src/lib/model-config/**'
      - 'src/app/admin/bi/models/**'
      - 'scripts/*model*'
      - 'docs/model-configuration-maintenance.md'
      - 'src/components/admin/billing/**'
      - 'src/components/**'
      - 'src/app/admin/billing/**'
      - 'src/app/admin/center/**'
      - 'src/app/admin/bi/**'
      - 'src/lib/admin-*.ts'
      - 'scripts/verify-admin-access.ts'
      - 'src/app/api/**'
      - 'scripts/*billing*'
      - 'package.json'
      - 'docs/billing-maintenance.md'
      - 'src/app/api/generate-image/**'
      - 'src/app/api/suite/**'
      - 'src/app/api/aplus/**'
      - 'src/lib/image-*.ts'
      - 'src/lib/durable-image-jobs.ts'
      - 'src/lib/canvas-image-tasks.ts'
      - 'src/lib/db.ts'
      - 'src/app/api/canvas/image-tasks/**'
      - 'src/app/api/recolor/**'
      - 'scripts/deploy-release.sh'
      - 'scripts/ops/release_lifecycle.py'
      - 'scripts/ops/test_release_lifecycle.py'
      - 'scripts/ops/verify_release_lifecycle_cli.py'
      - 'scripts/ops/worker_handoff.py'
      - 'scripts/ops/test_worker_handoff.py'
      - 'scripts/worker-runtime.mjs'
      - 'scripts/video-worker.mjs'
      - 'scripts/test-worker-runtime.mjs'
      - 'scripts/verify-worker-handoff.mjs'
      - 'scripts/verify-worker-legacy.mjs'
      - 'scripts/verify-release-entrypoints.sh'
      - 'scripts/verify-coordinated-release.sh'
      - 'scripts/verify-image-gateway.ts'
      - 'scripts/verify-credit-billing.ts'
      - 'scripts/verify-global-image-quality.ts'
      - 'scripts/verify-single-product.ts'
      - 'src/lib/mock-data.ts'
      - 'src/lib/pricing.ts'
      - 'src/app/plans/**'
      - 'src/app/admin/pricing/**'
      - 'src/lib/commerce.ts'
      - 'src/components/pricing-research.tsx'
      - 'scripts/verify-pricing-proposal.ts'
      - 'scripts/verify-pricing-access.mjs'
      - '.github/workflows/image-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-gateway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: isolated-fixture
          POSTGRES_DB: gateway_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d gateway_fixture"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: HTTP and HTTPS billing request fingerprints and UUID compatibility
        run: npm run verify:browser-billing-crypto
      - name: Direct image submission without fee confirmation
        run: npm run verify:direct-generation
      - name: Canvas text-only response contract
        run: npm run verify:canvas-text-output
      - name: Verify and unpack pinned Router test source
        run: |
          python3 scripts/verify-router-fixture.py
          python3 scripts/prepare-router-fixture.py --destination output/model-config-20261004/router-source
      - uses: actions/setup-go@v5
        with:
          go-version-file: output/model-config-20261004/router-source/go.mod
      - name: Verify durable release lifecycle and fail-closed acceptance
        run: |
          python3 scripts/ops/test_release_lifecycle.py -v
          python3 scripts/ops/verify_release_lifecycle_cli.py
          python3 -m unittest discover -s scripts/ops -p test_worker_handoff.py -v
          node --test scripts/test-worker-runtime.mjs
          node scripts/verify-worker-handoff.mjs
          docker run --rm --network none --read-only --tmpfs /tmp -e NAUMI_VERIFY_RELEASE_FIXTURE=1 -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/repo:ro" python:3.12-slim bash /repo/scripts/verify-release-entrypoints.sh
      - name: Verify coordinated release and failure rollback
        run: |
          python3 scripts/verify-model-deploy.py
          for failure in 0 1; do
            docker run --rm --network none -e NAUMI_VERIFY_RELEASE_FIXTURE=1 -e FAIL_HEALTH=$failure -v "$PWD/scripts/deploy-release.sh:/deploy.sh:ro" -v "$PWD/scripts/verify-coordinated-release.sh:/verify.sh:ro" --entrypoint bash node:24-bookworm-slim /verify.sh
          done
      - name: Build full application
        shell: bash
        env:
          # Match the already-required fixed application build; scope to build only.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p output/image-gateway-build
          git rev-parse HEAD > output/image-gateway-build/SOURCE.txt
          git status --porcelain > output/image-gateway-build/SOURCE_TREE.txt
          node scripts/prepare-model-ui-production.mjs before-build --out output/model-ui-production
          if npm run build > output/image-gateway-build/build.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat output/image-gateway-build/build.log
          if [ "$status" -ne 0 ]; then
            details="$(tail -n 40 output/image-gateway-build/build.log | tail -c 8000)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            printf '::error title=Full application build failed::%s\n' "$details"
          fi
          if [ "$status" -eq 0 ]; then
            node scripts/prepare-model-ui-production.mjs seal --out output/model-ui-production
          fi
          exit "$status"
      - name: Configurable billing and transactional regressions
        run: npm run verify:billing-all
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
          BILLING_VERIFY_EVIDENCE: output/image-gateway-billing
      - name: Feature models, RMB usage, routing and postprocess recovery
        run: npm run verify:business-routing
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - name: Registered model execution and private control-plane regressions
        run: |
          for check in coverage config publication admin execution tools router-contract performance review flow shared-capacity; do
            npm run verify:model-$check
          done
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
          NAUMI_VERIFY_ROUTER_SOURCE: output/model-config-20261004/router-source
      - name: Billing admin browser acceptance
        run: |
          npx playwright install --with-deps chromium
          npm run verify:billing-ui
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - name: Business admin publication and feature model browser acceptance
        run: npm run verify:business-ui
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
          NAUMI_VERIFY_ROUTER_SOURCE: output/model-config-20261004/router-source
      - run: npm run verify:pricing-proposal
      - run: npm run verify:pricing-access
      - run: npm run verify:image-gateway
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - run: npm run verify:credit-billing
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - run: npm run verify:global-image-quality
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - run: npm run verify:private-bi
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - run: npm run verify:bi-management
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - run: npm run verify:admin-access
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - run: npm run verify:single-product
        env:
          DATABASE_URL: postgres://fixture:isolated-fixture@127.0.0.1:5432/gateway_fixture
          NAUMI_VERIFY_ISOLATED_DB: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-gateway-build-${{ github.sha }}
          path: |
            output/image-gateway-build/
            output/model-ui-production/
            output/image-gateway-billing/
            output/image-gateway-regression/*.json
            output/credit-billing-regression/*.json
            output/billing-20261003/ui/
            output/billing-20261003/ui-results.json
            output/billing-20261003/ui-app.*.log
            output/billing-20261003/ui-provider.json
            output/billing-20261003/ui-frozen-price.json
            output/billing-20261003/navigation-*.json
            output/billing-20261003/*.png
            output/model-config-ui-fixture/runs/*/RUN.json
            output/model-config-ui-fixture/runs/*/source/output/model-config-ui-fixture/CLEANUP.json
            output/model-config-ui-fixture/runs/*/source/output/billing-routing-20261007/
            output/model-config-ui-fixture/runs/*/source/output/model-batch-20261007/
            output/model-config-ui-fixture/runs/*/source/output/apimart-preset-20261007/
          if-no-files-found: warn
