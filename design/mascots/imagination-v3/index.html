function animate(r,t,dt){

  if(p.kind==='ripple'){const pos=o.geometry.attributes.position,rest=o.geometry.userData.rest;for(let k=0;k<pos.count;k++){const px=rest[k*3],pz=rest[k*3+2];pos.setY(k,rest[k*3+1]+Math.sin(px*3.2+q*2.7)*.35*energy*Math.abs(px)+Math.sin(pz*3+q*2)*.13*energy)}pos.needsUpdate=true;o.geometry.computeVertexNormals();o.rotation.z=.035*s}
  if(p.kind==='crescent'){o.rotation.z=.09*energy*s;o.scale.y=1-.03*energy*s}
  if(p.kind==='petal'){const closed=a==='sleep'?.95:a==='shy'?.72:.08;o.rotation.x=closed+.1*energy*f;o.scale.y=1+.05*energy*f}
  if(p.kind==='trail'){o.rotation.z=.09*energy*f;o.scale.y=1+.1*energy*Math.sin(q*3-i);o.position.x+=.04*energy*f}
 });

 const alpha=paused?0:reduce.matches?1:1-Math.exp(-14*dt),gx=a==='sleep'?0:r.gaze.tx,gy=a==='sleep'?0:r.gaze.ty;r.gaze.x+=(gx-r.gaze.x)*alpha;r.gaze.y+=(gy-r.gaze.y)*alpha;

}
