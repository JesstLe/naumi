async function pfFetch(scope,params,body){if(!scopeCurrent(scope)||!scope.active)throw Error('WORKSPACE_CHANGED');const r=await fetch('/api/enterprise/workflow/performance?'+new URLSearchParams({enterpriseId:scope.enterpriseId,teamId:scope.teamId,...params}),{method:body?'POST':'GET',credentials:'same-origin',cache:'no-store',headers:{'x-workflow-viewer':scope.email,...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!scopeCurrent(scope))throw Error('WORKSPACE_CHANGED');if(!r.ok){const d=await r.json().catch(()=>({error:'WORKFLOW_RESPONSE_INVALID'})),e=Error(typeof d.error==='string'?d.error:d.error?.code||'WORKFLOW_RESPONSE_INVALID');e.status=r.status;if(r.status===401||e.message==='ACCOUNT_CHANGED'){workspaceClear();workspace.directory=null;workspace.error=pfError(e);shell();}throw e;}return r;}

let multipartContext=null;
function multipartStop(){if(multipartContext){multipartContext.controller.abort();multipartContext=null;}}
const multipartClose=closeOverlay;closeOverlay=function(){multipartStop();multipartClose();};
const multipartClear=workspaceClear;workspaceClear=function(){multipartStop();multipartClear();};
function multipartError(e){return ({MULTIPART_NOT_ENABLED:'大文件上传尚未启用。',UPLOAD_PARTS_MISSING:'还有分片未上传，请继续上传。',PART_HASH_MISMATCH:'分片内容校验失败，请重新选择原文件。',PART_SIZE_MISMATCH:'分片大小不一致，请重新选择原文件。',UPLOAD_EXPIRED:'上传已过期，请清理后重新创建。',UPLOAD_NOT_OPEN:'该上传已结束，请刷新状态。',UPLOAD_ALREADY_COMPLETED:'文件已合并，请返回任务查看交付文件。',UPLOAD_SESSION_LIMIT:'同时上传的文件已达上限，请先完成或取消其他上传。',UPLOAD_DISK_SPACE_LOW:'暂存空间不足，请联系管理员。',UPLOAD_NOT_FOUND:'上传不存在或当前账号无权访问。',UPLOAD_RESULT_UNCERTAIN:'结果暂未确认，刷新后核对同一上传记录再继续。',FILE_CONTENT_CHANGED:'所选文件与原分片清单不同，请选择原文件。',SCAN_SIZE_UNSUPPORTED:'文件超过当前检查容量，检查通过前不能提交交付。'})[e.message]||deliveryError(e);}
function multipartAlive(c){return multipartContext===c&&c.root.isConnected&&scopeCurrent(c.scope);}
function multipartCheck(c){if(!multipartAlive(c))throw Error('WORKSPACE_CHANGED');c.controller.signal.throwIfAborted();}
async function multipartFetch(c,query={},body,part){multipartCheck(c);const r=await fetch('/api/enterprise/workflow/uploads?'+new URLSearchParams({enterpriseId:c.scope.enterpriseId,teamId:c.scope.teamId,...query}),{method:part?'PUT':body?'POST':'GET',credentials:'same-origin',cache:'no-store',signal:c.controller.signal,headers:{'x-workflow-viewer':c.scope.email,...(part?{'content-type':'application/octet-stream'}:body?{'content-type':'application/json'}:{})},...(part?{body:part}:body?{body:JSON.stringify(body)}:{})});multipartCheck(c);const data=await r.json();if(!r.ok){const e=Error(typeof data.error==='string'?data.error:data.error?.code||'UPLOAD_SERVICE_UNAVAILABLE');e.status=r.status;if([401,403].includes(r.status)||e.message==='ACCOUNT_CHANGED'){workspaceClear();workspace.directory=null;workspace.error=workspaceError(e);shell();}throw e;}return data;}
function multipartProgress(c,label,percent){if(!multipartAlive(c))return;c.root.querySelector('[data-mp-status]').textContent=label;c.root.querySelector('progress').value=percent;}
function multipartAttach(section,o,t,scope,cap,canUpload){if(!cap?.enabled)return;const button=document.createElement('button');button.type='button';button.className='btn';button.dataset.multipartOpen='';button.textContent='大文件 / 续传';button.onclick=()=>multipartOpen(o,t,scope,cap,canUpload);section.querySelector('h4').after(button);}
async function multipartRefresh(c){const data=await multipartFetch(c,{action:'list',orderId:c.o.id,taskId:c.t.id,page:String(c.page)});multipartCheck(c);c.sessions=data.sessions;c.total=data.total;const state={open:'待完成',completed:'已合并',cancelled:'已取消',expired:'已过期'},list=c.root.querySelector('[data-mp-list]');
 list.innerHTML=data.sessions.map(s=>`<article class="mp-session" data-mp-session="${s.id}"><div><b>${esc(s.name)}</b><small>${(s.bytes/1048576).toFixed(2)} MiB · ${s.received.length}/${s.parts.length} 片 · ${s.expired?'已过期':state[s.state]}</small><small>到期 ${esc(new Date(s.expiresAt).toLocaleString('zh-CN'))}${s.cleanupPending?' · 暂存待清理':''}</small></div><div class="mp-actions">${s.state==='open'&&!s.expired&&c.canUpload?`<button class="btn sm" data-mp-select="${s.id}">选择续传</button>${s.received.length===s.parts.length?`<button class="btn sm" data-mp-prepare="${s.id}">准备合并</button>`:''}`:''}${s.state==='open'&&!s.expired?`<button class="btn sm" data-mp-cancel="${s.id}">取消上传</button>`:''}${s.cleanupPending||s.expired?`<button class="btn sm" data-mp-clean="${s.id}">清理暂存</button>`:''}</div></article>`).join('')||'<p class="source-note">暂无上传记录</p>';
 c.root.querySelector('[data-mp-page]').textContent=`第 ${c.page} 页 · 共 ${data.total} 项`;c.root.querySelector('[data-mp-prev]').disabled=c.page<=1;c.root.querySelector('[data-mp-next]').disabled=c.page*30>=data.total;

 list.querySelectorAll('[data-mp-clean]').forEach(b=>b.onclick=()=>multipartRun(c,async()=>{await multipartFetch(c,{}, {operation:'cleanup',id:b.dataset.mpClean});multipartProgress(c,'已核对暂存清理状态',0);}));
 list.querySelectorAll('[data-mp-prepare]').forEach(b=>b.onclick=()=>multipartRun(c,()=>multipartPrepare(c,b.dataset.mpPrepare)));
}
async function multipartRun(c,fn){if(c.busy||!multipartAlive(c))return;c.busy=true;c.root.querySelector('[data-mp-error]').textContent='';c.root.querySelectorAll('button,input').forEach(b=>{if(!b.matches('[data-close],[data-mp-pause]'))b.disabled=true;});try{await fn();}catch(e){if(multipartAlive(c))c.root.querySelector('[data-mp-error]').textContent=e.name==='AbortError'?'已暂停；刷新列表核对已接收分片。':multipartError(e);}finally{if(multipartAlive(c)){c.controller=new AbortController();c.busy=false;c.root.querySelectorAll('button,input').forEach(b=>b.disabled=false);try{await multipartRefresh(c);}catch(e){if(multipartAlive(c))c.root.querySelector('[data-mp-error]').textContent=multipartError(e);}}}}
async function multipartPrepare(c,id){const state=await multipartFetch(c,{action:'status',id});if(state.session.state!=='open'||state.session.received.length!==state.session.parts.length)throw Error('UPLOAD_PARTS_MISSING');const current=await requirementRequest('order',{id:c.o.id},undefined,c.scope);multipartCheck(c);const version=current.order.version,box=c.root.querySelector('[data-mp-confirm]');box.innerHTML=`<p>合并 ${esc(state.session.name)} · 任务版本 v${version}</p><button class="btn primary" data-mp-complete>确认合并为候选文件</button>`;box.querySelector('button').onclick=()=>multipartRun(c,async()=>{const result=await multipartFetch(c,{}, {operation:'complete',id,expectedVersion:version});multipartProgress(c,result.asset?.scan?.usable===false?'候选文件已保存，等待检查通过':'候选文件已保存；返回任务后选择并提交交付',100);box.innerHTML='';if(c.selected?.id===id)c.selected=null;});}
async function multipartUpload(c){const file=c.root.querySelector('[data-mp-file]').files[0];if(!file||file.size<1||file.size>c.cap.maxBytes)throw Error('请选择不超过512MiB的非空文件');const hashes=[],count=Math.ceil(file.size/c.cap.partBytes);
 for(let i=0;i<count;i++){multipartCheck(c);const buffer=await file.slice(i*c.cap.partBytes,Math.min(file.size,(i+1)*c.cap.partBytes)).arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',buffer);multipartCheck(c);hashes.push([...new Uint8Array(hash)].map(n=>n.toString(16).padStart(2,'0')).join(''));multipartProgress(c,`核验文件 ${i+1}/${count} 片`,(i+1)/count*20);}
 let session=c.selected;if(session){if(file.size!==session.bytes||hashes.length!==session.parts.length||hashes.some((h,i)=>h!==session.parts[i]))throw Error('FILE_CONTENT_CHANGED');session=(await multipartFetch(c,{action:'status',id:session.id})).session;}
 else{const data={name:file.name,bytes:file.size,parts:hashes};if(c.pending&&JSON.stringify(data)!==JSON.stringify(c.pending.file))throw Error('FILE_CONTENT_CHANGED');if(!c.pending){const current=await requirementRequest('order',{id:c.o.id},undefined,c.scope);multipartCheck(c);c.pending={file:data,command:{operation:'create',sessionId:crypto.randomUUID(),orderId:c.o.id,taskId:c.t.id,expectedVersion:current.order.version,...data}};}session=(await multipartFetch(c,{},c.pending.command)).session;c.selected=session;c.pending=null;}
 if(session.state!=='open'||session.expired)throw Error(session.expired?'UPLOAD_EXPIRED':'UPLOAD_NOT_OPEN');const received=new Set(session.received);for(let i=0;i<count;i++){multipartCheck(c);if(!received.has(i)){await multipartFetch(c,{id:session.id,part:String(i)},undefined,file.slice(i*c.cap.partBytes,Math.min(file.size,(i+1)*c.cap.partBytes)));received.add(i);}multipartProgress(c,`已接收 ${received.size}/${count} 片`,20+received.size/count*80);}
