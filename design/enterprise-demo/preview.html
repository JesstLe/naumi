const WM=globalThis.WorkbookModel;
let wbState=null,wbRaw=null,wbBad=false,wbActiveId='team',wbPreview=null,wbPreviewQuery='',wbPreviewIssuesOnly=false;
function wbRead(){try{const raw=localStorage.getItem(SCHED_KEY);if(raw===wbRaw&&wbState)return wbState;if(raw)wbState=WM.validate(JSON.parse(raw));else{const legacy=localStorage.getItem(LEGACY_SCHED_KEY);wbState=legacy?WM.migrate(JSON.parse(legacy)):WM.create();}wbRaw=raw;wbBad=false;}catch{wbBad=true;wbState=WM.create();schedNotice='工作簿配置读取异常，临时使用默认视图；原值保持，可导出原始配置后重置演示。';}return wbState;}
function wbActive(){const s=wbRead();return s.views.find(v=>v.id===wbActiveId&&!v.archived)||s.views.find(v=>!v.archived);}
function wbReadFacade(){const s=wbRead();return WM.facade(s,wbActive().id);}
function wbCommit(next){try{if(wbBad)throw new Error('原配置损坏，请导出后重置');if(localStorage.getItem(SCHED_KEY)!==wbRaw)throw new Error('配置已被其他窗口更新，请重新载入');WM.validate(next);const raw=JSON.stringify(next);localStorage.setItem(SCHED_KEY,raw);wbRaw=raw;wbState=next;return true;}catch(e){toast('保存失败：'+e.message);return false;}}
function wbCommitFacade(next){try{return wbCommit(WM.commitView(wbRead(),wbActive().id,next));}catch(e){toast(e.message);return false;}}
function wbReset(){try{localStorage.removeItem(SCHED_KEY);localStorage.removeItem(LEGACY_SCHED_KEY);wbState=null;wbRaw=null;wbBad=false;wbActiveId='team';schedStore=null;schedRaw=null;schedEditor=null;schedTab='team';schedFilters={query:'',assignee:'all',status:'all'};schedCollapsed.clear();schedNotice='';wbPreview=null;}catch{toast('重置配置失败');}}

function sourceRows(data){const kind=sourceState.kind;return `<div class="table-wrap source-table"><table><thead><tr><th>作品 / 操作</th><th>成员与时间</th><th>${kind==='ledger'?'积分变动':'提示词 / 操作内容'}</th><th>${kind==='generations'?'扣费 / 预估':kind==='ledger'?'用途来源':'来源与溯源'}</th><th>来源编号</th></tr></thead><tbody>${data.rows.map((r,i)=>`<tr><td>${kind==='artworks'&&ES.mediaPath(r,sourceState.enterpriseId)?`<span class="source-image" data-source-image="${i}">加载图片…</span>`:''}<b>${esc(r.title||sourceStatus(r.operation||r.ledgerKind))}</b><small>${esc(sourceStatus(r.status))}</small></td><td>${esc(r.account.name||r.account.email)}<small>${esc(sourceTime(r.createdAt))}</small></td><td>${kind==='ledger'?`<strong class="${r.credits.delta<0?'source-negative':'source-positive'}">${sourceCredits(r.credits.delta)}</strong>`:r.prompt?`<details><summary>${esc(r.prompt.slice(0,100))}${r.prompt.length>100?'…':''}</summary><pre>${esc(r.prompt)}</pre></details>`:'未记录'}</td><td>${kind==='generations'?`${sourceCredits(r.credits.charged)}<small>预估 ${sourceCredits(r.credits.quoted)} · ${r.credits.evidence==='linked-ledger'?'已关联扣费流水':'待核对'}</small>`:esc(kind==='ledger'?r.sourceLabel||'未记录':r.provenance||r.sourceLabel||'未记录')}</td><td><code>${esc(r.ref.kind)}</code><small>${esc(r.ref.id)}</small></td></tr>`).join('')}</tbody></table></div>`;}

async function sourceLoad(){const s=sourceState;sourceClear();s.error='';s.loading=true;const epoch=s.epoch,controller=s.controller=new AbortController();sourcePaint();
 const client=ES.createClient();try{
   const result=await client.read({action:'context'},controller.signal);if(epoch!==s.epoch)return;
   const c=ES.validateContext(result.data),old=s.context;
   if(old&&(old.viewer.email!==c.viewer.email||old.instanceId!==c.instanceId)){s.email='';s.enterpriseId='';s.page=1;}
   s.context=c;s.fixture=result.fixture;
   if(!c.enterprises.some(e=>e.id===s.enterpriseId)){s.enterpriseId=c.enterprises[0]?.id||'';s.email='';s.page=1;}
   if(!s.from){const d=new Date(Date.now()+8*3600000);s.to=d.toISOString().slice(0,10);s.from=new Date(d.getTime()-29*86400000).toISOString().slice(0,10);}
   if(!s.enterpriseId){s.loading=false;sourcePaint();return;}
   const members=await client.read({action:'members',enterpriseId:s.enterpriseId},controller.signal);if(epoch!==s.epoch)return;
   if(members.data.enterprise?.id!==s.enterpriseId||!Array.isArray(members.data.members))throw Error('来源成员范围不一致');
   s.members=members.data.members;
   if(s.email&&!s.members.some(m=>m.email===s.email)){s.email='';s.page=1;}
   const response=await client.read({action:'records',enterpriseId:s.enterpriseId,kind:s.kind,email:s.email,from:s.from,to:s.to,page:String(s.page)},controller.signal);if(epoch!==s.epoch)return;
   s.data=ES.validatePage(response.data,{enterpriseId:s.enterpriseId,instanceId:c.instanceId,kind:s.kind});s.loading=false;sourcePaint();await sourceImages(epoch,controller.signal);
 }catch(e){if(epoch!==s.epoch||e.name==='AbortError')return;sourceClear();s.context=null;s.error=e.message||'来源读取失败';sourcePaint();}
}
async function sourceImages(epoch,signal){const s=sourceState;if(s.kind!=='artworks'||!s.data)return;let index=0;const rows=s.data.rows;
 const next=async()=>{for(;;){const i=index++;if(i>=rows.length||epoch!==s.epoch)return;const path=ES.mediaPath(rows[i],s.enterpriseId);if(!path)continue;
   try{const response=await fetch(path,{credentials:'same-origin',cache:'no-store',signal});if(response.status===401||response.status===403){if(epoch===s.epoch){sourceClear();s.context=null;s.error='来源媒体授权已失效，请刷新来源';sourcePaint();}return;}
     if(!response.ok||!response.headers.get('content-type')?.startsWith('image/'))throw Error();const blob=await response.blob();if(blob.size>32*1024*1024)throw Error();if(epoch!==s.epoch)return;
     const el=document.querySelector(`[data-source-image="${i}"]`);if(!el)continue;const url=URL.createObjectURL(blob);s.urls.push(url);const img=document.createElement('img');img.alt='Naumi 来源作品';img.src=url;el.replaceChildren(img);
   }catch{if(epoch===s.epoch){const el=document.querySelector(`[data-source-image="${i}"]`);if(el)el.textContent='图片暂不可读取';}}
 }};await Promise.all([next(),next()]);
}

(function(root){
 'use strict';
 function tree(all,matching){
  const byId=new Map(all.map(r=>[r.excelRow,r])),selected=new Set(matching.map(r=>r.excelRow)),groups=new Map();
  for(const r of matching){
   const parentId=r.resolution?.parentRow||(r.parentLabel&&r.parentCandidates.length===1?r.parentCandidates[0]:null),parent=byId.get(parentId);
   const linked=parent&&parent.excelRow!==r.excelRow&&!parent.parentLabel;
   const key=linked?parent.excelRow:r.excelRow;
   if(!groups.has(key))groups.set(key,{root:linked?parent:r,context:linked&&!selected.has(parent.excelRow),children:[],pending:!linked&&!!r.parentLabel});
   if(linked)groups.get(key).children.push({row:r,confirmed:!!r.resolution});
  }
  return [...groups.values()].map(g=>({...g,children:g.children.sort((a,b)=>a.row.excelRow-b.row.excelRow)})).sort((a,b)=>Number(a.pending)-Number(b.pending)||Number(!a.root.title)-Number(!b.root.title)||Number(!a.children.length)-Number(!b.children.length)||a.root.excelRow-b.root.excelRow);
 }
 root.ImportViewModel={tree};
})(globalThis);

function importTable(rows){let group;return `<div class="table-wrap import-table"><table><thead><tr><th>源行 / 产品需求名称</th><th>产品图</th><th>需求方</th><th>设计师</th><th>下发日期</th><th>沟通后开始</th><th>源设计完成日期</th><th>任务排期情况</th><th>源完成情况</th><th>数量原文</th><th>父记录 / 确认项</th></tr></thead><tbody>${(imported.mode==='designer'||imported.mode==='owner'?[...rows].sort((a,b)=>a.raw[imported.mode==='designer'?'设计师':'需求方'].localeCompare(b.raw[imported.mode==='designer'?'设计师':'需求方'])):rows).map(r=>{const k=imported.mode==='designer'?r.raw['设计师']:imported.mode==='owner'?r.raw['需求方']:null,g=k!==null&&k!==group?`<tr class="import-group"><td colspan="11">${esc(k||'未填写')}</td></tr>`:'';group=k;return g+`<tr><td><button class="sc-link" data-import-row="${r.excelRow}">${esc(r.title||'（原表名称空白）')}</button><small class="sc-sub">Excel 第 ${r.excelRow} 行${r.parentLabel?' · 子标签':' · 无父标签'}</small></td><td>${importThumbnail(r)}</td>${['需求方','设计师','下发日期','任务沟通后开始时间','设计完成日期','任务排期情况','任务完成情况','数量'].map(k=>`<td>${esc(r.raw[k]||'—')}</td>`).join('')}<td>${esc(r.parentLabel||'—')}<small class="sc-sub">${r.resolution?'已确认 → 第'+r.resolution.parentRow+'行':r.parentCandidates.length===1?'唯一名称候选 → 第'+r.parentCandidates[0]+'行':r.parentCandidates.length>1?'候选 '+r.parentCandidates.join(' / '):''}</small><button class="sc-link" data-import-row="${r.excelRow}">${r.issues.length?'查看 '+r.issues.length+' 项核对':'查看原始记录'}</button></td></tr>`;}).join('')||'<tr><td colspan="11">没有符合条件的记录</td></tr>'}</tbody></table></div>`;}

async function importRequest(action,params={},body){const r=await fetch('/api/enterprise/imports?'+new URLSearchParams({action,...params}),{method:body?'POST':'GET',credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json',...(body?{'content-type':'application/json','x-csrf-token':imported.csrf}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!r.headers.get('content-type')?.includes('application/json'))throw Error('真实数据服务尚未连接');const data=await r.json();if(!r.ok){const error=Error(data.error==='VERSION_CONFLICT'?'此行已被其他窗口更新，请刷新后重新确认':data.error||'真实数据读取失败');error.status=r.status;throw error;}return data;}

async function slPicker(o,t,scope){let kind='artworks',page=1,from='',to='',email='',epoch=0;const render=async()=>{const n=++epoch;slClear();const uiEpoch=sourceLinksState.epoch;try{const data=await slRequest(scope,{action:'candidates',orderId:o.id,taskId:t.id,kind,page:String(page),...(from?{from}:{}),...(to?{to}:{}),...(email?{email}:{})});if(n!==epoch||uiEpoch!==sourceLinksState.epoch||!scopeCurrent(scope))return;overlay('选择Naumi来源记录',`<form id="slFilters" class="sl-picker-filters"><label class="field">记录类型<select name="kind">${schedOptions([['artworks','图片与提示词'],['generations','生成任务'],['ledger','积分明细']],kind)}</select></label><label class="field">来源账号<input name="email" value="${esc(email)}" placeholder="留空：当前有权查看的账号" maxlength="254"></label><label class="field">开始日期<input type="date" name="from" value="${esc(from)}"></label><label class="field">结束日期<input type="date" name="to" value="${esc(to)}"></label><button class="btn">查询</button></form><div class="sl-picker-rows">${data.rows.map((r,i)=>`<article class="sl-record">${slRecord(r)}<button class="btn sm primary" data-sl-select="${i}">选择此记录</button></article>`).join('')||'<div class="empty">当前范围暂无记录</div>'}</div><div class="source-pager"><span>共 ${data.total} 条 · 第 ${page} 页</span><button class="btn" id="slPrev" ${page<=1?'disabled':''}>上一页</button><button class="btn" id="slNext" ${page*data.size>=data.total?'disabled':''}>下一页</button></div>`,`<button class="btn" data-close>关闭</button>`,true);$('#slFilters').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);kind=f.get('kind');from=f.get('from');to=f.get('to');email=f.get('email').trim();page=1;void render();};$('#slPrev').onclick=()=>{page--;void render();};$('#slNext').onclick=()=>{page++;void render();};slBindImages($('#overlay'),scope);$$('[data-sl-select]').forEach(b=>b.onclick=()=>slConfirm(o,t,data.rows[Number(b.dataset.slSelect)].ref,'link-source',scope));}catch(e){if(n===epoch&&scopeCurrent(scope))toast(slError(e));}};await render();}
async function slConfirm(o,t,ref,type,scope){const epoch=++sourceLinksState.epoch;let record=null;try{if(type==='link-source')record=(await slRequest(scope,{action:'record',orderId:o.id,taskId:t.id,kind:ref.kind,id:ref.id})).record;}catch(e){toast(slError(e));return;}if(epoch!==sourceLinksState.epoch||!scopeCurrent(scope))return;slClear();let commandId=crypto.randomUUID(),last='';dialog(type==='link-source'?'确认关联Naumi记录':'解除来源关联',`<form id="slConfirm">${record?`<div class="sl-record">${slRecord(record)}</div>`:`<p>${esc(ref.kind)} · ${esc(ref.id)}</p>`}<label class="field">${type==='link-source'?'业务归属说明':'解除原因'}<textarea name="reason" required maxlength="2000" rows="3"></textarea></label><label class="field"><span><input type="checkbox" name="confirmed" required> ${type==='link-source'?'确认这条来源记录与当前任务有关，不作为历史企业归属或绩效认定':'只解除本任务引用，保留来源记录和历史审计'}</span></label><p id="slError" class="sc-form-error" hidden></p></form>`,`<button class="btn" data-close>取消</button><button class="btn primary" type="submit" form="slConfirm">确认</button>`);slBindImages($('#overlay'),scope);$('#slConfirm').onsubmit=async e=>{e.preventDefault();const reason=new FormData(e.target).get('reason');if(last&&last!==reason)commandId=crypto.randomUUID();last=reason;const b=$('[form="slConfirm"]');b.disabled=true;try{await slRequest(scope,{}, {commandId,orderId:o.id,expectedVersion:o.version,action:{type,taskId:t.id,ref,reason}});if(!scopeCurrent(scope))return;closeOverlay();await realTaskDetail(o.id,t.id);toast('来源关联已保存');}catch(err){if($('#slError')){$('#slError').hidden=false;$('#slError').textContent=slError(err);}b.disabled=false;}};}
window.addEventListener('focus',()=>{const d=$('#overlay .drawer');if(workspace.active&&d?.workflowDetail?.order.tasks.find(t=>t.id===d.dataset.taskId)?.sourceLinks?.length)void realTaskDetail(d.dataset.orderId,d.dataset.taskId);});

shell();
</script></body></html>
