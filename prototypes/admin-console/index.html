ircle cx="174" cy="188" r="27" fill="#f6aa37"/><circle cx="174" cy="188" r="23" fill="#ffe1a1"/><circle cx="174" cy="188" r="20" fill="#f9b94b"/><path d="M174 169v38m-19-19h38m-33-14 28 28m0-28-28 28" stroke="#ffe4a8" stroke-width="2"/><path d="M40 177q18-28 34-5-25 16-34 5" fill="#809b6a"/></svg>`;return `<svg viewBox="0 0 240 240" role="img" aria-label="香氛产品演示插画"><rect width="240" height="240" fill="#eee6e1"/><path d="M152 0h88v240H82z" fill="#e3d6ce"/><ellipse cx="123" cy="203" rx="65" ry="12" fill="#cbbcb1"/><rect x="78" y="93" width="85" height="101" rx="9" fill="#a97751"/><rect x="83" y="98" width="75" height="90" rx="7" fill="#c39b72"/><rect x="90" y="112" width="5" height="64" rx="2" fill="#e7c6a2" opacity=".65"/><rect x="100" y="65" width="41" height="31" rx="3" fill="#262424"/><rect x="101" y="65" width="39" height="6" rx="2" fill="#393534"/><rect x="91" y="130" width="60" height="43" fill="#f6f1e8"/><text x="121" y="147" text-anchor="middle" font-family="Georgia" font-size="11" fill="#494238">AUREL</text><text x="121" y="160" text-anchor="middle" font-family="Arial" font-size="5" letter-spacing="1.6" fill="#817261">EAU DE PARFUM</text><path d="M176 205q-2-62 28-110M180 181q18-13 27-6M182 155q-16-15-14-30M193 128q15-5 22-1" stroke="#7e8e74" stroke-width="2" fill="none"/></svg>`}
function renderNav(){const html=(items)=>items.map(([p,label,ic])=>`<button class="nav-button ${state.page===p?'active':''}" data-page="${p}" aria-label="${label}" ${state.page===p?'aria-current="page"':''}>${icon(ic)}<span class="nav-label">${label}</span>${p==='notices'&&notices.some(n=>!n.read)?`<span class="nav-count">${notices.filter(n=>!n.read).length}</span>`:''}</button>`).join('');$('#primary-nav').innerHTML=html(navItems.slice(0,3));$('#secondary-nav').innerHTML=html(navItems.slice(3));$('#breadcrumb-current').textContent=navItems.find(x=>x[0]===state.page)?.[1]||'运营概览';$('#bell-dot').hidden=!notices.some(n=>!n.read)}
function heading(title,actions=''){return `<div class="page-heading"><div class="heading-title"><h1>${title}</h1><span class="demo-badge">演示数据</span></div><div class="heading-actions">${actions}</div></div>`}
const period=()=>`<div class="period-toggle" aria-label="统计时间"><button data-period="today" class="${state.period==='today'?'active':''}" aria-pressed="${state.period==='today'}">今天</button><button data-period="week" class="${state.period==='week'?'active':''}" aria-pressed="${state.period==='week'}">近 7 天</button></div>`;
const footer=()=>`<div class="footer-note"><span>Naumi 管理中心</span><span>本地预览 · 数据与操作仅用于演示</span></div>`;
function spark(n){return `<svg class="stat-mini" viewBox="0 0 80 24" aria-hidden="true"><path d="${['M1 21 12 16 22 18 32 10 42 14 51 7 61 9 70 4 79 3','M1 19 12 17 22 18 32 14 42 10 51 12 61 6 70 8 79 3','M1 8 12 15 22 11 32 13 42 17 51 12 61 17 70 16 79 19','M1 20 12 18 22 18 32 13 42 15 51 8 61 11 70 6 79 3'][n]}" fill="none" stroke="${n===2?'var(--warning)':'var(--chart-1)'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function overview(){const week=state.period==='week';let vals=week?['8,712','8,216','15','52,308']:['1,284','1,206','15','7,236'];return heading('运营概览',`${period()}<button class="button" data-action="export-overview">${icon('download')}导出报表</button>`)+`<div class="stats-grid">${['生成任务','已完成','排队中','已结算积分'].map((s,i)=>`<section class="stat"><div class="stat-label">${s}${icon(['layers','circle-check','clock-3','wallet'][i])}</div><div class="stat-number">${vals[i]}</div><div class="stat-foot"><span ${i===0||i===3?'class="trend-positive"':''}>${[week?'较上周 +12.6%':'较昨日 +12.8%',week?'完成率 94.3%':'完成率 93.9%','生成中 45',week?'较上周 +9.8%':'较昨日 +8.2%'][i]}</span>${spark(i)}</div></section>`).join('')}</div><div class="overview-grid"><section class="panel"><div class="panel-header"><h2>生成趋势</h2><div class="panel-tools"><span><i class="legend-dot"></i>已完成</span><span><i class="legend-dot light"></i>其他</span></div></div><div class="chart-meta"><strong>${vals[0]}</strong><span>个任务</span></div><div class="chart">${chart(week)}</div></section><section class="panel"><div class="panel-header"><h2>供应商用量</h2><button class="button ghost" data-action="go-suppliers" aria-label="查看供应商">${icon('arrow-up-right')}</button></div><div class="channel-list">${[['APIB','A',week?'5,708':'842',66,''],['APIMart','M',week?'2,760':'406',32,'green'],['其他','…',week?'244':'36',3,'']].map(([n,a,c,w,k])=>`<div><div class="channel-line"><span class="provider-icon ${k}">${a}</span><span class="channel-name">${n}<small>${w}% 的任务</small></span><span class="channel-value">${c}</span></div><div class="track"><span style="width:${w}%"></span></div></div>`).join('')}</div><div class="channel-summary"><span>启用的通道</span><strong>4 / 6</strong></div></section></div><section class="panel table-panel"><div class="panel-header"><h2>最近生成任务</h2><button class="button ghost" data-page="tasks">查看全部 ${icon('arrow-right')}</button></div><div class="table-wrap">${taskTable(tasks.slice(0,5),true)}</div><div class="table-footer"><span>最近 5 条任务</span><span>更新于 10:48:52</span></div></section>`+footer()}
function chart(week,measuredWidth=540){const raw=week?[42,55,48,76,84,72,97]:[10,8,7,6,7,11,19,31,44,38,54,69,61,76,68,63,82,98,76,67,51,40,26,15];const W=Math.max(250,measuredWidth),H=155,left=30,top=12,bottom=129,width=W-37,step=width/raw.length;return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${week?'近七天':'今日每小时'}生成任务趋势，演示数据"><g>${[0,1,2,3].map((v)=>`<path class="chart-grid" d="M${left} ${top+v*38}H${W-7}"/><text class="chart-text" x="0" y="${top+4+v*38}">${[120,80,40,0][v]}</text>`).join('')}</g>${raw.map((v,i)=>{let x=left+i*step+step*.18,w=step*.55,h=v*1.1;return `<g><rect class="chart-cap" x="${x}" y="${bottom-h-6}" width="${w}" height="${h+6}" rx="2"/><rect class="chart-bar" x="${x}" y="${bottom-h}" width="${w}" height="${h}" rx="2"><title>${week?`10 月 ${21+i} 日`:`${String(i).padStart(2,'0')}:00`}：演示值 ${v}</title></rect></g>`}).join('')}${(week?(W<400?[0,2,4,6]:[0,1,2,3,4,5,6]):(W<400?[0,6,12,18,23]:[0,4,8,12,16,20,23])).map(i=>`<text class="chart-text" x="${left+(i+.48)*step}" y="149" text-anchor="middle">${week?`10/${21+i}`:`${String(i).padStart(2,'0')}:00`}</text>`).join('')}</svg>`}
function taskTable(list,small=false){return `<table class="table"><thead><tr><th>任务 / 内容</th><th>用户</th><th>模型</th><th>状态</th>${small?'': '<th>供应商</th>'}<th class="numeric">积分</th><th>提交时间</th><th></th></tr></thead><tbody>${list.map(t=>`<tr data-task-row="${t.id}"><td><div class="task-main">${thumb(t.art)}<div><div class="task-title">${esc(t.title)}</div><div class="task-id">${t.id}</div></div></div></td><td>${esc(t.user)}</td><td>${esc(t.model)}</td><td>${badge(t.status)}</td>${small?'':`<td>${t.provider}</td>`}<td class="numeric">${t.credits>0?t.credits:'—'}</td><td class="mono">${t.time}</td><td><button class="button link" data-task="${t.id}" aria-label="查看任务 ${t.id}">查看 ${icon('chevron-right')}</button></td></tr>`).join('')||`<tr><td colspan="${small?8:9}">${empty('没有匹配的任务','clear-task-filters')}</td></tr>`}</tbody></table>`}
function empty(text,action){return `<div class="empty-state">${icon('search-x')}<strong>${text}</strong>${action?`<button class="button small" data-action="${action}">清除筛选</button>`:''}</div>`}
function filteredTasks(){return tasks.filter(t=>(state.taskStatus==='all'||t.status===state.taskStatus)&&(state.taskProvider==='all'||t.provider===state.taskProvider)&&`${t.id} ${t.title} ${t.user} ${t.model}`.toLowerCase().includes(state.taskQuery.toLowerCase()))}
function taskPage(){return heading('生成任务',`<button class="button" data-action="export-tasks">${icon('download')}导出记录</button><button class="button" data-action="refresh">${icon('refresh-cw')}刷新</button>`)+`<div class="tabs" aria-label="任务状态">${[['all','全部'],['done','已完成'],['running','生成中'],['queued','排队中'],['failed','失败']].map(([s,n])=>`<button class="tab ${state.taskStatus===s?'active':''}" data-task-status="${s}" aria-pressed="${state.taskStatus===s}">${n}<span class="tab-count">${s==='all'?tasks.length:tasks.filter(t=>t.status===s).length}</span></button>`).join('')}</div><section class="panel"><div class="filters"><label class="input-wrap search-input">${icon('search')}<input id="task-query" aria-label="搜索任务" placeholder="搜索任务、用户或内容" value="${esc(state.taskQuery)}"></label><select class="select" id="task-provider" aria-label="筛选供应商"><option value="all">全部供应商</option>${['APIB','APIMart'].map(p=>`<option ${state.taskProvider===p?'selected':''}>${esc(p)}</option>`).join('')}</select><span class="filter-spacer"></span><button class="button ghost" data-action="clear-task-filters">重置</button><button class="icon-button" data-action="density" aria-label="切换表格密度" aria-pressed="${state.compact}">${icon('list-filter')}</button></div><div id="task-results"></div></section>`+footer()}
function pagination(count,page,kind){let pages=Math.max(1,Math.ceil(count/8));return `<div class="table-footer"><span>共 ${count} 条${count?` · 第 ${(page-1)*8+1}–${Math.min(page*8,count)} 条`:''}</span><div class="pagination"><button class="page-number" data-${kind}-page="${page-1}" ${page===1?'disabled':''} aria-label="上一页">${icon('chevron-left')}</button>${Array.from({length:pages},(_,i)=>`<button class="page-number ${page===i+1?'active':''}" data-${kind}-page="${i+1}" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-number" data-${kind}-page="${page+1}" ${page===pages?'disabled':''} aria-label="下一页">${icon('chevron-right')}</button></div></div>`}
function renderTaskResults(){let list=filteredTasks();state.taskPage=Math.min(state.taskPage,Math.max(1,Math.ceil(list.length/8)));$('#task-results').innerHTML=`<div class="table-wrap">${taskTable(list.slice((state.taskPage-1)*8,state.taskPage*8))}</div>${pagination(list.length,state.taskPage,'task')}`}
function modelPage(){return heading('模型与供应商',`<button class="button primary" data-action="add-provider">${icon('plus')}添加供应商</button>`)+`<div class="tabs" aria-label="模型与供应商"><button class="tab ${state.modelTab==='models'?'active':''}" data-model-tab="models">模型通道<span class="tab-count">${models.length}</span></button><button class="tab ${state.modelTab==='suppliers'?'active':''}" data-model-tab="suppliers">供应商<span class="tab-count">${providers.length}</span></button></div>${state.modelTab==='suppliers'?supplierCards():`<section class="panel"><div class="filters"><label class="input-wrap search-input">${icon('search')}<input id="model-query" aria-label="搜索模型" placeholder="搜索模型名称" value="${esc(state.modelQuery)}"></label><select class="select" id="model-provider" aria-label="模型供应商筛选"><option value="all">全部供应商</option>${providers.map(p=>p.name).map(p=>`<option ${state.modelProvider===p?'selected':''}>${esc(p)}</option>`).join('')}</select><select class="select" id="model-status" aria-label="模型状态筛选"><option value="all">全部状态</option><option value="enabled" ${state.modelStatus==='enabled'?'selected':''}>已启用</option><option value="disabled" ${state.modelStatus==='disabled'?'selected':''}>已停用</option></select></div><div id="model-results"></div></section>`}`+footer()}
function renderModelResults(){const list=models.filter(m=>(state.modelProvider==='all'||m.provider===state.modelProvider)&&(state.modelStatus==='all'||m.enabled===(state.modelStatus==='enabled'))&&`${m.name} ${m.sub}`.toLowerCase().includes(state.modelQuery.toLowerCase()));$('#model-results').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>模型</th><th>供应商</th><th>规格</th><th class="numeric">积分 / 次</th><th class="numeric">今日调用</th><th>启用</th><th></th></tr></thead><tbody>${list.map(m=>`<tr><td><div class="model-name"><span class="provider-icon ${m.provider==='APIMart'?'dark':''}">${m.name.startsWith('GPT')?'G':m.name.startsWith('Seedream')?'S':'✦'}</span><div><div class="task-title">${esc(m.name)}</div><div class="task-id">${m.sub}</div></div></div></td><td>${esc(m.provider)}</td><td><span class="chip">${esc(m.params)}</span></td><td class="numeric">${m.price}</td><td class="numeric">${m.count}</td><td><button class="toggle" role="switch" aria-checked="${m.enabled}" aria-label="${esc(m.name)} ${esc(m.provider)} 启用状态" data-toggle-model="${m.id}"></button></td><td><button class="button link" data-model="${m.id}">配置 ${icon('chevron-right')}</button></td></tr>`).join('')||`<tr><td colspan="7">${empty('没有匹配的模型')}</td></tr>`}</tbody></table></div><div class="table-footer"><span>${list.length} 个通道</span><span>配置变更仅保留在本次预览</span></div>`}
function supplierCards(){return '<div class="supplier-grid">'+providers.map((p,i)=>'<section class="supplier-card"><div class="supplier-top"><span class="provider-icon '+(i===1?'green':'')+'">'+esc(p.name[0])+'</span><h2>'+esc(p.name)+'</h2>'+badge(p.enabled?'enabled':'disabled')+'</div><div class="supplier-values"><div><label>模型通道</label><strong>'+models.filter(m=>m.provider===p.name).length+'</strong></div><div><label>今日调用</label><strong>'+p.calls+'</strong></div><div><label>请求成功率</label><strong>'+p.success+'</strong></div><div><label>平均耗时</label><strong>'+p.duration+'</strong></div></div><div class="supplier-actions"><span class="subtle" style="font-size:11px">'+(p.draft?'未连接 · 草稿':p.enabled?'托管通道':'已停用')+'</span><button class="button small" data-provider="'+esc(p.name)+'">查看配置 '+icon('chevron-right')+'</button></div></section>').join('')+'</div>'}
function userPage(){return heading('用户管理',`<button class="button" data-action="export-users">${icon('download')}导出用户</button>`)+`<div class="page-summary"><div class="page-summary-item"><span class="status-pill"></span>用户总数<strong>${users.length}</strong></div><div class="page-summary-item"><span class="status-pill blue"></span>团队用户<strong>${users.filter(u=>u.plan==='团队版').length}</strong></div><div class="page-summary-item"><span class="status-pill amber"></span>今日活跃<strong>16</strong></div></div><section class="panel"><div class="filters"><label class="input-wrap search-input">${icon('search')}<input id="user-query" placeholder="搜索用户、账号或团队" aria-label="搜索用户" value="${esc(state.userQuery)}"></label><select class="select" id="user-plan" aria-label="用户类型"><option value="all">全部用户</option><option ${state.userPlan==='个人版'?'selected':''}>个人版</option><option ${state.userPlan==='团队版'?'selected':''}>团队版</option></select><span class="filter-spacer"></span><button class="button ghost" data-action="clear-users">重置</button></div><div id="user-results"></div></section>`+footer()}
function filteredUsers(){return users.filter(u=>(state.userPlan==='all'||u.plan===state.userPlan)&&`${u.name} ${u.account} ${u.team}`.toLowerCase().includes(state.userQuery.toLowerCase()))}

function ledgerRows(){return tasks.filter(t=>t.status==='done'||t.hold>0).map((t,i)=>({id:`demo-ledger-${800+i}`,task:t.id,user:t.user,kind:t.credits?'settled':'held',amount:t.credits||t.hold,time:t.time}))}
function billingPage(){return heading('积分与账务',`<button class="button" data-action="export-billing">${icon('download')}导出流水</button>`)+`<div class="stats-grid"><section class="stat"><div class="stat-label">已结算积分${icon('wallet')}</div><div class="stat-number">7,236</div><span class="subtle" style="font-size:11px">今日</span></section><section class="stat"><div class="stat-label">预占积分${icon('clock-3')}</div><div class="stat-number">360</div><span class="subtle" style="font-size:11px">处理中任务</span></section><section class="stat"><div class="stat-label">已释放积分${icon('rotate-ccw')}</div><div class="stat-number">108</div><span class="subtle" style="font-size:11px">未交付任务</span></section><section class="stat"><div class="stat-label">充值积分${icon('arrow-down-to-line')}</div><div class="stat-number">12,000</div><span class="subtle" style="font-size:11px">今日</span></section></div><section class="panel"><div class="filters"><label class="input-wrap search-input">${icon('search')}<input id="billing-query" placeholder="搜索任务或用户" aria-label="搜索账务" value="${esc(state.billingQuery)}"></label><select class="select" id="billing-kind" aria-label="账务类型"><option value="all">全部类型</option><option value="settled" ${state.billingKind==='settled'?'selected':''}>已结算</option><option value="held" ${state.billingKind==='held'?'selected':''}>预占中</option></select></div><div id="billing-results"></div></section>`+footer()}
function filteredLedger(){return ledgerRows().filter(r=>(state.billingKind==='all'||r.kind===state.billingKind)&&`${r.task} ${r.user}`.toLowerCase().includes(state.billingQuery.toLowerCase()))}
function renderBillingResults(){const list=filteredLedger();$('#billing-results').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>流水 / 关联任务</th><th>用户</th><th>类型</th><th class="numeric">积分</th><th>时间</th><th></th></tr></thead><tbody>${list.slice(0,12).map(r=>`<tr><td><div class="mono">${r.id}</div><div class="task-id">${r.task}</div></td><td>${r.user}</td><td>${r.kind==='settled'?'<span class="badge done">已结算</span>':'<span class="badge queued">预占中</span>'}</td><td class="numeric">${r.kind==='settled'?'-':''}${r.amount}</td><td class="mono">${r.time}</td><td><button class="button link" data-task="${r.task}">查看任务 ${icon('chevron-right')}</button></td></tr>`).join('')||`<tr><td colspan="6">${empty('没有匹配的流水')}</td></tr>`}</tbody></table></div><div class="table-footer"><span>显示 ${Math.min(12,list.length)} / ${list.length} 条</span><span>演示账务</span></div>`}
function noticePage(){const list=notices.filter(n=>state.noticeFilter==='all'||!n.read);return heading('通知公告',`<button class="button" data-action="read-all">${icon('check-check')}全部已读</button>`)+`<div class="tabs"><button class="tab ${state.noticeFilter==='all'?'active':''}" data-notice-filter="all">全部通知<span class="tab-count">${notices.length}</span></button><button class="tab ${state.noticeFilter==='unread'?'active':''}" data-notice-filter="unread">未读<span class="tab-count">${notices.filter(n=>!n.read).length}</span></button></div><section class="panel notice-list">${list.map(n=>`<article class="notice-item"><span class="notice-icon">${icon(n.kind==='更新'?'sparkles':'wrench')}</span><div class="notice-body"><div class="notice-title">${n.title}${!n.read?'<span class="unread"></span>':''}</div><p>${n.text}</p>${!n.read?`<button class="button link" data-read="${n.id}">标为已读</button>`:''}</div><time class="notice-time">${n.date}</time></article>`).join('')||empty('暂无未读通知')}</section>`+footer()}
function settingsPage(){return heading('系统设置')+`<div class="settings-grid"><form class="panel settings-section" id="settings-form"><h2>基本信息</h2><div class="field"><label for="site-name">站点名称</label><input id="site-name" name="siteName" required maxlength="30" value="${esc(state.settings.siteName)}"></div><div class="field"><label for="default-view">默认打开</label><select id="default-view" name="defaultView"><option value="overview" ${state.settings.defaultView==='overview'?'selected':''}>运营概览</option><option value="tasks" ${state.settings.defaultView==='tasks'?'selected':''}>生成任务</option><option value="models" ${state.settings.defaultView==='models'?'selected':''}>模型与供应商</option></select></div><div class="field"><label for="admin-email">管理员邮箱</label><input type="email" id="admin-email" value="${esc(state.settings.emailAddress)}"></div><div class="form-actions"><button class="button primary" type="submit">保存预览设置</button></div></form><section class="panel settings-section"><h2>显示与通知</h2><div class="setting-row"><span>紧凑表格</span><button role="switch" class="toggle" aria-label="紧凑表格" aria-checked="${state.compact}" data-action="density"></button></div><div class="setting-row"><span>站内通知</span><button role="switch" class="toggle" aria-label="站内通知" aria-checked="${state.settings.notifications}" data-setting-toggle="notifications"></button></div><div class="setting-row"><span>邮件通知</span><button role="switch" class="toggle" aria-label="邮件通知" aria-checked="${state.settings.email}" data-setting-toggle="email"></button></div><div class="setting-row"><span>主题</span><span class="chip">浅色</span></div></section></div>`+footer()}
function render(){renderNav();$('#main-content').innerHTML=({overview,tasks:taskPage,models:modelPage,users:userPage,billing:billingPage,notices:noticePage,settings:settingsPage})[state.page]();if(state.page==='tasks')renderTaskResults();if(state.page==='models'&&state.modelTab==='models')renderModelResults();if(state.page==='users')renderUserResults();if(state.page==='billing')renderBillingResults();ROOT.classList.toggle('compact',state.compact);hydrate();renderChart()}
function renderChart(){const c=$('.chart');if(c){const cs=getComputedStyle(c);c.innerHTML=chart(state.period==='week',c.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))}}
const chartResize=new ResizeObserver(()=>{if(state.page==='overview')renderChart()});chartResize.observe($('#main-content'));
function navigate(p){if(!navItems.some(x=>x[0]===p))return;state.page=p;ROOT.classList.remove('menu-open');$('.mobile-menu').setAttribute('aria-expanded','false');render();if(location.hash!==`#${p}`)location.hash=p;window.scrollTo({top:0,behavior:'instant'})}
function toast(text){const t=$('#toast');t.innerHTML=icon('circle-check')+`<span>${esc(text)}</span>`;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function dialogShell(title,body,footerHtml=''){return `<div class="dialog-header"><h2 id="dialog-title">${title}</h2><button class="icon-button" data-action="close-detail" aria-label="关闭详情">${icon('x')}</button></div><div class="dialog-content">${body}</div>${footerHtml?`<div class="dialog-footer">${footerHtml}</div>`:''}`}
function openDialog(html,kind,id){if(!$('#detail-dialog').open)state.returnFocus=document.activeElement;state.dialogKind=kind;state.dialogId=id;const d=$('#detail-dialog');d.innerHTML=html;if(!d.open)d.showModal();hydrate(d)}
function closeDetail(){const d=$('#detail-dialog');d.close();const f=state.returnFocus;state.dialogKind=null;if(f?.isConnected)f.focus()}
function openTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;let body=`<div class="detail-title"><div><h3>${t.title}</h3><span class="mono">${t.id}</span></div>${badge(t.status)}</div>${t.status==='done'?`<div class="output-art">${artwork(t.art)}<span class="output-tag">演示素材 · 1024 × 1024</span></div>`:`<div class="output-art">${empty(t.status==='queued'?'等待执行':t.status==='running'?'正在生成':'生成失败')}</div>`}<dl class="detail-facts"><div><dt>用户</dt><dd>${t.user}</dd></div><div><dt>生成方式</dt><dd>${t.type}</dd></div><div><dt>模型</dt><dd>${t.model}</dd></div><div><dt>供应商</dt><dd>${t.provider}</dd></div><div><dt>提交时间</dt><dd>2026-10-27 ${t.time}</dd></div><div><dt>执行耗时</dt><dd>${t.duration}</dd></div><div class="wide"><dt>提示词</dt><dd>极简商业摄影，柔和自然光，干净背景，突出产品材质与细节。</dd></div></dl><div class="detail-section"><h3>执行时间线</h3><ol class="timeline"><li>任务已受理 <span class="time">${t.time}</span><small>模型与参数已冻结</small></li><li class="${t.status==='queued'?'pending':''}">${t.status==='queued'?'等待执行槽位':'供应商已接收'}<small>${t.status==='queued'?'尚未提交供应商':t.provider+' · demo-upstream-'+t.id.slice(-4)}</small></li><li class="${t.status==='done'?'':t.status==='failed'?'error':'pending'}">${t.status==='done'?'图片已保存，任务已完成':t.status==='failed'?'参数校验失败':'等待生成结果'}<small>${t.status==='done'?'父任务与子任务均已完成':t.status==='failed'?'演示错误：该模型不支持所选尺寸':'结果返回后进入保存与交付'}</small></li></ol></div><div class="detail-section"><h3>账务记录</h3><div class="billing-line"><span class="subtle">已结算</span><strong>${t.credits} 积分</strong></div><div class="billing-line"><span class="subtle">当前预占</span><span>${t.hold} 积分</span></div></div>`;openDialog(dialogShell('任务详情',body,`<small>本地演示任务</small><button class="button" data-action="close-detail">关闭</button>`),'task',id)}
function openModel(id){const m=models.find(x=>x.id===id);if(!m)return;openDialog(dialogShell('模型通道配置',`<div class="detail-title"><div><h3>${esc(m.name)}</h3><span class="mono">${m.sub}</span></div>${badge(m.enabled?'enabled':'disabled')}</div><form id="model-form"><div class="detail-section"><h3>基本配置</h3><div class="field"><label for="model-name">显示名称</label><input id="model-name" name="name" value="${esc(m.name)}" required maxlength="60"></div><div class="field-pair"><div class="field"><label for="model-p">供应商</label><select id="model-p" name="provider">${providers.map(p=>p.name).map(p=>`<option ${p===m.provider?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="field"><label for="model-price">积分 / 次</label><input id="model-price" name="price" type="number" min="1" max="1000" step="1" required value="${m.price}"></div></div><div class="field"><label for="model-spec">输出规格</label><input id="model-spec" name="params" value="${esc(m.params)}" required maxlength="60"></div></div><div class="detail-section"><h3>默认参数</h3><div class="field-pair"><div class="field"><label for="ratio">画面比例</label><select id="ratio" name="ratio">${['1:1','3:4','16:9'].map(r=>`<option ${r===(m.ratio||'1:1')?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label for="quality">质量</label><select id="quality" name="quality">${['标准','高质量'].map(q=>`<option ${q===(m.quality||'标准')?'selected':''}>${q}</option>`).join('')}</select></div></div></div></form>`,`<small>仅修改本次预览数据</small><div class="heading-actions"><button class="button" data-action="close-detail">取消</button><button class="button primary" type="submit" form="model-form">保存草稿</button></div>`),'model',id)}
function openProvider(name){const provider=providers.find(p=>p.name===name);openDialog(dialogShell(name?'供应商配置':'添加供应商',`<form id="provider-form"><div class="field"><label for="provider-name">供应商名称</label><input id="provider-name" required value="${esc(name||'')}" placeholder="供应商名称" maxlength="40"></div><div class="field"><label for="provider-protocol">协议</label><select id="provider-protocol">${['OpenAI 兼容','供应商异步任务'].map(p=>`<option ${provider?.protocol===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field"><label for="provider-url">接口地址</label><input id="provider-url" type="url" required value="${esc(provider?.url||'https://provider.example.test/v1')}"></div><div class="field"><label for="provider-key">API Key</label><input id="provider-key" type="password" autocomplete="off" placeholder="预览不需要真实密钥" maxlength="100"></div><div class="field-pair"><div class="field"><label for="provider-limit">并发上限</label><input id="provider-limit" type="number" value="${provider?.limit||4}" min="1" max="100" required></div><div class="field"><label for="provider-timeout">超时（秒）</label><input id="provider-timeout" type="number" value="${provider?.timeout||180}" min="1" max="600" required></div></div></form>`,`<small>预览不发起连接</small><div class="heading-actions"><button class="button" data-action="close-detail">取消</button><button class="button primary" form="provider-form" type="submit">保存草稿</button></div>`),'provider',name||'new')}
function openUser(id){const u=users.find(x=>x.id===id);if(!u)return;const jobs=tasks.filter(t=>t.user===u.name).slice(0,3);openDialog(dialogShell('用户详情',`<div class="detail-title"><div class="user-info"><span class="avatar" style="width:43px;height:43px;font-size:18px">${u.name[0]}</span><div><h3>${esc(u.name)}</h3><span class="mono">${u.id}</span></div></div>${badge(u.enabled?'enabled':'disabled')}</div><dl class="detail-facts"><div class="wide"><dt>登录账号</dt><dd>${u.account}</dd></div><div><dt>所属团队</dt><dd>${u.team}</dd></div><div><dt>当前方案</dt><dd>${u.plan}</dd></div><div><dt>可用积分</dt><dd>${u.credits}</dd></div><div><dt>累计任务</dt><dd>${u.used}</dd></div></dl><div class="detail-section"><h3>最近任务</h3>${jobs.map(t=>`<button class="search-result" data-task="${t.id}">${thumb(t.art)}<div><strong>${t.title}</strong><small>${t.time}</small></div><span class="result-type">${statusName[t.status]}</span></button>`).join('')||'<p class="subtle">暂无任务</p>'}</div>`,`<small>本地演示用户</small><button class="button" data-action="close-detail">关闭</button>`),'user',id)}
function openSearch(){const d=$('#search-dialog');d.showModal();$('#global-query').value='';renderSearch('');$('#global-query').focus()}
function renderSearch(q){q=q.toLowerCase();let results=[...tasks.map(t=>({type:'任务',id:t.id,label:t.title,sub:t.id,icon:'layers',action:'task'})),...users.map(u=>({type:'用户',id:u.id,label:u.name,sub:u.account,icon:'user',action:'user'})),...models.map(m=>({type:'模型',id:m.id,label:m.name,sub:m.provider,icon:'box',action:'model'}))].filter(x=>`${x.label} ${x.sub}`.toLowerCase().includes(q)).slice(0,8);$('#search-results').innerHTML=results.map(r=>`<button class="search-result" data-search-${r.action}="${r.id}">${icon(r.icon)}<div><strong>${esc(r.label)}</strong><small>${esc(r.sub)}</small></div><span class="result-type">${r.type}</span></button>`).join('')||empty('没有搜索结果')}
function csvExport(name,header,rows){const clean=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\uFEFF'+[header,...rows].map(r=>r.map(clean).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示数据')}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;if(d.page){navigate(d.page);return}if(d.period){state.period=d.period;render();return}if(d.task){openTask(d.task);return}if(d.user){openUser(d.user);return}if(d.model){openModel(d.model);return}if(d.provider){openProvider(d.provider);return}if(d.taskStatus){state.taskStatus=d.taskStatus;state.taskPage=1;render();return}if(d.taskPage){state.taskPage=+d.taskPage;renderTaskResults();return}if(d.userPage){state.userPage=+d.userPage;renderUserResults();return}if(d.modelTab){state.modelTab=d.modelTab;render();return}if(d.toggleModel){const m=models.find(m=>m.id===d.toggleModel);m.enabled=!m.enabled;renderModelResults();toast('已更新预览中的通道状态');return}if(d.noticeFilter){state.noticeFilter=d.noticeFilter;render();return}if(d.read){notices.find(n=>n.id===d.read).read=true;render();return}if(d.settingToggle){state.settings[d.settingToggle]=!state.settings[d.settingToggle];b.setAttribute('aria-checked',state.settings[d.settingToggle]);toast('已更新预览设置');return}for(const kind of ['Task','User','Model']){const id=d['search'+kind];if(id){$('#search-dialog').close();({Task:openTask,User:openUser,Model:openModel})[kind](id);return}}
const act=d.action;if(!act)return;
if(act==='menu'){ROOT.classList.toggle('menu-open');b.setAttribute('aria-expanded',ROOT.classList.contains('menu-open'));return}if(act==='close-menu'){ROOT.classList.remove('menu-open');$('.mobile-menu').setAttribute('aria-expanded','false');$('.mobile-menu').focus();return}
if(act==='search')return openSearch();if(act==='close-search')return $('#search-dialog').close();if(act==='close-detail')return closeDetail();if(act==='go-suppliers'){state.modelTab='suppliers';return navigate('models')}if(act==='add-provider')return openProvider('');if(act==='refresh')return toast('演示记录已刷新');if(act==='density'){state.compact=!state.compact;ROOT.classList.toggle('compact',state.compact);b.setAttribute('aria-pressed',state.compact);if(state.page==='settings')render();return}if(act==='clear-task-filters'){state.taskStatus='all';state.taskQuery='';state.taskProvider='all';state.taskPage=1;return render()}if(act==='clear-users'){state.userQuery='';state.userPlan='all';state.userPage=1;return render()}if(act==='read-all'){notices.forEach(n=>n.read=true);render();return toast('全部通知已读')}
if(act==='export-tasks')return csvExport('naumi-demo-tasks.csv',['任务ID','内容','用户','状态','已结算积分'],filteredTasks().map(t=>[t.id,t.title,t.user,statusName[t.status],t.credits]));if(act==='export-users')return csvExport('naumi-demo-users.csv',['用户ID','用户','团队','可用积分'],filteredUsers().map(u=>[u.id,u.name,u.team,u.credits]));if(act==='export-billing')return csvExport('naumi-demo-ledger.csv',['流水ID','任务ID','用户','类型','积分'],filteredLedger().map(r=>[r.id,r.task,r.user,r.kind,r.amount]));if(act==='export-overview')return csvExport('naumi-demo-overview.csv',['时间','指标','数量'],[['2026-10-27','生成任务',state.period==='today'?1284:8712],['2026-10-27','已完成',state.period==='today'?1206:8216],['2026-10-27','排队中',15]]);
});
document.addEventListener('input',e=>{const v=e.target.value;switch(e.target.id){case'task-query':state.taskQuery=v;state.taskPage=1;renderTaskResults();break;case'model-query':state.modelQuery=v;renderModelResults();break;case'user-query':state.userQuery=v;state.userPage=1;renderUserResults();break;case'billing-query':state.billingQuery=v;renderBillingResults();break;case'global-query':renderSearch(v);break}});
document.addEventListener('change',e=>{const v=e.target.value;switch(e.target.id){case'task-provider':state.taskProvider=v;state.taskPage=1;renderTaskResults();break;case'model-provider':state.modelProvider=v;renderModelResults();break;case'model-status':state.modelStatus=v;renderModelResults();break;case'user-plan':state.userPlan=v;state.userPage=1;renderUserResults();break;case'billing-kind':state.billingKind=v;renderBillingResults();break}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='model-form'){const f=new FormData(e.target);const m=models.find(m=>m.id===state.dialogId);m.name=String(f.get('name')).trim();m.price=Number(f.get('price'));m.provider=String(f.get('provider'));m.params=String(f.get('params'));m.ratio=String(f.get('ratio'));m.quality=String(f.get('quality'));closeDetail();render();toast('模型草稿已保存到本地预览')}if(e.target.id==='provider-form'){const name=$('#provider-name').value.trim();const existing=providers.find(p=>p.name===state.dialogId);if(providers.some(p=>p.name===name&&p!==existing)){toast('供应商名称已存在');return}const data={name,protocol:$('#provider-protocol').value,url:$('#provider-url').value,limit:Number($('#provider-limit').value),timeout:Number($('#provider-timeout').value),draft:true};if(existing){const old=existing.name;Object.assign(existing,data);models.filter(m=>m.provider===old).forEach(m=>m.provider=name)}else providers.push({...data,enabled:false,calls:0,success:'—',duration:'—'});closeDetail();state.modelTab='suppliers';navigate('models');toast('供应商草稿已保存；未建立真实连接')}if(e.target.id==='settings-form'){state.settings.siteName=$('#site-name').value.trim();state.settings.defaultView=$('#default-view').value;state.settings.emailAddress=$('#admin-email').value;toast('设置已保存到本次预览')}});
document.addEventListener('keydown',e=>{if(e.key==='Tab'){const dialog=$('#search-dialog').open?$('#search-dialog'):$('#detail-dialog').open?$('#detail-dialog'):null;if(dialog){const items=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]',dialog).filter(x=>x.getClientRects().length);const first=items[0],last=items[items.length-1];if(items.length&&e.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){e.preventDefault();last.focus()}else if(items.length&&!e.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){e.preventDefault();first.focus()}}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#detail-dialog').open)openSearch()}if(e.key==='Escape'&&ROOT.classList.contains('menu-open')){ROOT.classList.remove('menu-open');$('.mobile-menu').setAttribute('aria-expanded','false');$('.mobile-menu').focus()}});
$('#detail-dialog').addEventListener('cancel',e=>{e.preventDefault();closeDetail()});
$('#detail-dialog').addEventListener('click',e=>{if(e.target===$('#detail-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDetail()}});
window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p!==state.page&&navItems.some(x=>x[0]===p))navigate(p)});
$('#brand-symbol').innerHTML=brandSymbol;const hash=location.hash.slice(1);if(navItems.some(x=>x[0]===hash))state.page=hash;render();
</script>

<script>

const V1 = { render, navigate, renderNav, taskPage, modelPage, userPage, billingPage, settingsPage, openTask, renderSearch };
const MODULES = [
  {id:'overview',label:'运营概览',icon:'layout-dashboard',tabs:[]},
  {id:'tenants',label:'租户管理',icon:'building-2',tabs:[['list','租户','/admin/tenants'],['teams','既有团队','/admin/teams'],['access','入口授权','/admin/team-access']]},

  {id:'tasks',label:'创作记录',icon:'layers',tabs:[['unified','统一创作','/admin/creations'],['history','历史业务任务','/admin/center?section=operations'],['images','图片','/admin/center?section=artworks'],['conversations','对话','/admin/center?section=conversations'],['calls','调用审计','/admin/center?section=calls']]},
  {id:'billing',label:'套餐与账务',icon:'wallet',tabs:[['config','账务配置','/admin/billing'],['wallet','钱包与充值','/admin/billing?section=wallet'],['orders','充值订单','/admin/center?section=orders'],['ledger','积分流水','/admin/center?section=ledger'],['prices','价格表','/admin/billing/price-table'],['cost','采购与对账','/admin/billing/supplier-cost'],['estimate','定价测算','/admin/pricing']]},
  {id:'models',label:'模型与供应商',icon:'box',tabs:[['manage','模型管理','/admin/model-management'],['balances','供应商余额','/admin/supplier-balances'],['config','完整配置','/admin/bi/models'],['health','健康巡检','/admin/model-health'],['quality','质量审计','/admin/center?section=models']]},
  {id:'health',label:'运行健康',icon:'circle-check',tabs:[]},
  {id:'settings',label:'系统与审计',icon:'settings-2',tabs:[['site','站点与接口','/admin?view=settings'],['management','管理日志','/admin/center?section=management'],['access','访问记录','/admin/center?section=access']]},

function cellHtml(row,col){const v=row[col.key];if(typeof v==='boolean')return v?'开启':'关闭';if(col.format==='status')return tag(v);if(col.format==='money')return Number(v).toFixed(2);if(col.format==='optional')return v==null?'未确认':esc(v);return esc(v??'—')}
function collectionResults(key){const d=readTables[key],f=tableState(key),list=filteredCollection(key),pages=Math.max(1,Math.ceil(list.length/8));f.page=Math.min(f.page,pages);return `<div class="table-wrap"><table class="table ${d.cols.length>6?'wide-table':''}"><thead><tr>${d.cols.map(col=>`<th class="${['number','money'].includes(col.format)?'numeric':''}">${col.label}</th>`).join('')}<th></th></tr></thead><tbody>${list.slice((f.page-1)*8,f.page*8).map((r)=>`<tr data-record-id="${esc(r.id)}">${d.cols.map(col=>`<td class="${['number','money'].includes(col.format)?'numeric':col.format==='wrap'?'cell-wrap':''}">${cellHtml(r,col)}</td>`).join('')}<td><button class="button link" data-row-table="${key}" data-row-id="${esc(r.id)}">${d.actionLabel||'查看'} ${icon('chevron-right')}</button></td></tr>`).join('')||`<tr><td colspan="${d.cols.length+1}">${empty('没有匹配的记录')}</td></tr>`}</tbody></table></div><div class="table-footer"><span>共 ${list.length} 条 · 第 ${f.page} / ${pages} 页</span><div class="pagination"><button class="page-number" data-collection-page="${key}:${f.page-1}" ${f.page===1?'disabled':''} aria-label="上一页">${icon('chevron-left')}</button>${Array.from({length:pages},(_,i)=>`<button class="page-number ${f.page===i+1?'active':''}" data-collection-page="${key}:${i+1}">${i+1}</button>`).join('')}<button class="page-number" data-collection-page="${key}:${f.page+1}" ${f.page===pages?'disabled':''} aria-label="下一页">${icon('chevron-right')}</button></div></div>`}

function openPermissions(row){const allowed=(row.allowed||'').split('、');const body=`<div class="user-info" style="margin-bottom:22px"><span class="avatar">${row.name[0]}</span><div>${esc(row.name)}<small>${row.account}</small></div></div><form id="permission-editor" data-user-id="${row.id}"><div class="field"><label for="permission-mode">授权模式</label><select id="permission-mode" name="mode"><option ${row.policy==='默认权限'?'selected':''}>默认权限</option><option ${row.policy==='自定义'?'selected':''}>自定义</option></select></div><div class="permission-grid">${featureList.map((name,i)=>`<label class="permission-cell"><input type="checkbox" name="feature" value="${name}" ${allowed.includes(name)?'checked':''}>${name}</label>`).join('')}</div></form>`;openDialog(dialogShell('功能权限',body,`<small>仅保存预览权限</small><button class="button primary" form="permission-editor">保存权限</button>`),'permissions',row.id)}
function editRecord(key,id){const def=readTables[key];const existing=id?(def.liveRows||def.rows).find(r=>r.id===id):null;if(!def)return;const row=existing||Object.fromEntries(def.cols.map(col=>[col.key,col.format==='number'||col.format==='money'?0:col.format==='status'?'draft':'']));const fields=def.cols.filter(c=>c.key!=='id').map(col=>{let type=typeof row[col.key]==='boolean'?'checkbox':['number','money'].includes(col.format)?'number':col.key.includes('email')||col.key==='account'?'email':col.key==='expires'||col.key==='expiry'?'date':col.format==='wrap'?'textarea':col.format==='status'?'select':'text';let options=col.key==='status'?['active','suspended','draft']:col.key==='entry'?['active','suspended']:['draft','active'];return [col.key,col.label,type,row[col.key]??'',options]});if(key==='prompts')fields.find(f=>f[0]==='content')[2]='textarea';const body=fieldsForm('record/'+key+'/'+(id||'new'),existing?'编辑'+def.title:'新增'+def.title,fields);openDialog(dialogShell(existing?'编辑记录':'新增记录',body,`<small>仅保存本地演示数据</small><button class="button" data-action="close-detail">关闭</button>`),'record',{key,id});substate.genericDialog={key,id}}
function showModelExtras(id){const m=models.find(x=>x.id===id);if(!m)return;const target=$('#model-form');if(!target)return;const opts=(list,v)=>list.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');target.insertAdjacentHTML('beforeend',`<details class="detail-section"><summary>供应通道与分辨率</summary><div class="field-pair" style="margin-top:16px"><div class="field"><label for="extra-weight">通道权重</label><input id="extra-weight" name="weight" type="number" min="1" max="100" value="${m.weight||100}"></div><div class="field"><label for="extra-resolutions">分辨率选项</label><input id="extra-resolutions" name="resolutions" value="${esc(m.resolutions||m.params)}"></div></div></details>${m.kind==='视频'?`<details class="detail-section" open><summary>视频能力</summary><div class="field-pair" style="margin-top:16px"><div class="field"><label for="extra-seconds">视频时长（秒）</label><input id="extra-seconds" name="seconds" type="number" min="1" max="30" value="${m.seconds||5}"></div><div class="field"><label for="extra-audio">音频</label><select id="extra-audio" name="audio">${opts(['关闭','开启'],m.audio?'开启':'关闭')}</select></div></div></details>`:`<details class="detail-section"><summary>图像高级参数</summary><div class="field-pair" style="margin-top:16px"><div class="field"><label for="extra-format">输出格式</label><select id="extra-format" name="format">${opts(['PNG','JPEG','WebP'],m.format||'PNG')}</select></div><div class="field"><label for="extra-background">背景</label><select id="extra-background" name="background">${opts(['自动','透明','不透明'],m.background||'自动')}</select></div></div></details><details class="detail-section"><summary>视频能力</summary><div class="field"><label for="extra-video">视频能力状态</label><select id="extra-video"><option>当前为图像模型，不支持视频</option></select></div></details>`}`)}
const originalModelDialog=openModel;
openModel=function(id){originalModelDialog(id);showModelExtras(id)};
const originalTaskDialog=openTask;
openTask=function(id){originalTaskDialog(id);if(!$('#detail-dialog').open)return;const t=tasks.find(x=>x.id===id);const content=$('#detail-dialog .dialog-content');content.insertAdjacentHTML('beforeend',`<details class="detail-section"><summary>输入素材与处理后输入</summary><div class="output-art" style="margin-top:14px">${artwork((t.art+1)%3)}<span class="output-tag">演示输入素材</span></div><div class="chips"><span class="chip">上传原图</span><span class="chip">参考图</span></div></details><details class="detail-section"><summary>关联子任务</summary>${factPairs([['子任务 ID','demo-child-'+id],['子任务状态',statusName[t.status]],['报价积分',t.credits||t.hold||6],['释放预占',t.status==='failed'?6:0]])}</details><details class="detail-section"><summary>技术与来源信息</summary>${factPairs([['来源','本地预览'],['冻结 scope','个人'],['模型版本','v32'],['计费版本','v18']])}</details>`)};

function subAction(action){if(action==='inspection-settings'){openDialog(dialogShell('巡检设置',fieldsForm('inspection/settings','模型健康巡检',forms.modelInspection)),'settings','inspection');return}if(action==='inspect-demo'){readTables.modelHealth.rows.filter(m=>m.enabled).forEach(m=>{m.status='healthy';m.last='10:50:00';m.reason='演示巡检产物已保存'});render();toast('已更新演示巡检结果');return}if(action==='new-public-model')return editRecord('publicModels',null)}
document.addEventListener('click',event=>{
 const target=event.target.closest('button,a');if(!target)return;const d=target.dataset;
 if(d.route){event.preventDefault();event.stopImmediatePropagation();visitRoute(d.route);return}
 if(target.matches('.brand')){event.preventDefault();event.stopImmediatePropagation();visitRoute('overview');return}
 if(d.rowTable){event.preventDefault();event.stopImmediatePropagation();openGenericRecord(d.rowTable,d.rowId);return}
 if(d.editTable){event.preventDefault();event.stopImmediatePropagation();editRecord(d.editTable,d.editId);return}
 if(d.createRow){event.preventDefault();event.stopImmediatePropagation();editRecord(d.createRow,null);return}
 if(d.subAction){event.preventDefault();event.stopImmediatePropagation();subAction(d.subAction);return}
 if(d.collectionPage){const idx=d.collectionPage.lastIndexOf(':');const key=d.collectionPage.slice(0,idx);tableState(key).page=Number(d.collectionPage.slice(idx+1));updateCollection(key);return}
 if(d.collectionReset){const f=tableState(d.collectionReset);f.q='';f.status='all';f.page=1;Object.assign(filterState(),f);render();syncAddress();return}
 if(d.collectionExport){const def=readTables[d.collectionExport];csvExport('naumi-demo-'+d.collectionExport+'.csv',def.cols.map(c=>c.label),filteredCollection(d.collectionExport).map(r=>def.cols.map(c=>r[c.key]??'')));return}
 if(d.resetDraft){delete substate.drafts[d.resetDraft];if(d.resetDraft.startsWith('record/'))editRecord(substate.genericDialog.key,substate.genericDialog.id);else if($('#detail-dialog').open&&d.resetDraft==='inspection/settings')subAction('inspection-settings');else render();return}
 if(d.action==='go-suppliers'){event.preventDefault();event.stopImmediatePropagation();visitRoute('models/manage/sources');return}
 if(d.action==='export-tasks'||d.action==='refresh'||d.taskStatus||d.taskPage||d.userPage||d.action==='clear-task-filters'||d.action==='clear-users'){queueMicrotask(syncAddress)}
},true);
document.addEventListener('input',event=>{const t=event.target;if(t.dataset.collectionQuery){const key=t.dataset.collectionQuery;const f=tableState(key);f.q=t.value;f.page=1;updateCollection(key)}if(t.dataset.galleryQuery){filterState().q=t.value;const pos=t.selectionStart;render();const fresh=$('[data-gallery-query]');fresh.focus();fresh.setSelectionRange(pos,pos);syncAddress()}if(['task-query','user-query'].includes(t.id))syncAddress()});
document.addEventListener('change',event=>{const t=event.target;if(t.dataset.collectionStatus){const key=t.dataset.collectionStatus;tableState(key).status=t.value;tableState(key).page=1;updateCollection(key)}if(['task-provider','user-plan'].includes(t.id))syncAddress()});
document.addEventListener('submit',event=>{
 const form=event.target;
 if(form.dataset.draftForm){event.preventDefault();const key=form.dataset.draftForm;const data={};for(const el of form.elements){if(!el.name||el.type==='password')continue;data[el.name]=el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value}data.__saved=true;substate.drafts[key]=data;
  if(key.startsWith('record/')){const {key:tableKey,id}=substate.genericDialog;const def=readTables[tableKey];if(id){Object.assign(def.rows.find(r=>r.id===id),data)}else{const row={...data,id:'demo-'+tableKey+'-'+(def.rows.length+100),art:0};def.rows.push(row)}closeDetail();render()}
  else if(key.startsWith('tenant/')&&key.endsWith('/entitlement')){const tenant=tenantsFixture.find(t=>t.id===substate.selectedTenant);Object.assign(tenant,{plan:data.plan,seats:data.seats,expires:data.expires,credits:data.credits});$('.form-status',form).textContent='已保存预览草稿'}
  else $('.form-status',form).textContent='已保存预览草稿';toast('已保存预览草稿');return;
 }
 if(form.id==='permission-editor'){event.preventDefault();const row=users.find(u=>u.id===form.dataset.userId);row.policy=form.elements.mode.value;row.allowed=new FormData(form).getAll('feature').join('、');closeDetail();render();toast('预览权限已保存')}
 if(form.id==='route-simulation'){event.preventDefault();$('#simulation-result').innerHTML=simulationResult($('#sim-provider').value,Number($('#sim-quantity').value),$('#sim-resolution').value);toast('本地模拟完成，未请求供应商')}
 if(form.id==='pricing-estimate'){event.preventDefault();const m=models.find(m=>m.id===$('#estimate-model').value);$('#estimate-result').innerHTML=estimateResult(m.price,Number($('#estimate-count').value),Number($('#estimate-cost').value),Number($('#estimate-credit').value))}
 if(form.id==='provider-form'&&!$('#detail-dialog').open)visitRoute('models/manage/sources');
});
document.addEventListener('submit',event=>{if(event.target.id==='model-form'){const m=models.find(m=>m.id===state.dialogId);if(m){const fd=new FormData(event.target);m.weight=Number(fd.get('weight'));m.resolutions=String(fd.get('resolutions'));m.format=String(fd.get('format'));m.background=String(fd.get('background'));if(m.kind==='视频'){m.seconds=Number(fd.get('seconds'));m.audio=fd.get('audio')==='开启'}}}},true);
document.addEventListener('click',event=>{const d=event.target.closest('button,a')?.dataset;if(d&&(d.taskStatus||d.taskPage||d.userPage||['clear-task-filters','clear-users'].includes(d.action)))syncAddress()});
window.addEventListener('popstate',()=>visitRoute(location.hash.slice(1)||'overview',true));
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1)||'overview';if(next.split('?')[0]!==substate.route?.path)visitRoute(next,true)});
const initialRoute=location.hash.slice(1)||'overview';
Object.assign(SOURCE_ALIASES,{
 '/admin?view=settings&section=users':'users/list','/admin?view=settings&section=artworks':'tasks/images',
 '/admin?view=settings&section=ledger':'billing/ledger','/admin?view=settings&section=credits':'billing/wallet/credits',
 '/admin?view=settings&section=wallet':'billing/wallet/products','/admin?view=settings&section=recharge':'billing/wallet/products',
 '/admin?view=settings&section=deploy':'deployments/instances','/admin?view=settings&section=models':'models/manage/models',
 '/admin?view=settings&section=model-config':'models/config',
 ...Object.fromEntries(['login','payment','payments','pay','wechat','smtp'].map(k=>['/admin?view=settings&tab='+k,'settings/site/auth'])),
 ...Object.fromEntries(['branding','site'].map(k=>['/admin?view=settings&tab='+k,'settings/site/brand'])),
 '/admin?view=settings&tab=page':'settings/site/pages','/admin?view=settings&tab=template':'settings/site/templates',
 '/admin?view=settings&tab=prompt':'settings/site/prompts','/admin?view=settings&tab=cardkey':'settings/site/cardkeys',
 '/admin?view=settings&tab=redeem':'settings/site/cardkeys'
});
window.NAUMI_PREVIEW_MANIFEST={modules:MODULES,routes,aliases:SOURCE_ALIASES,fixture:true,productionRequests:false};
visitRoute(initialRoute,true);

</script>
