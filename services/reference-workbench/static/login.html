<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录生图软件</title><style>body{margin:0;background:#f4f6f8;color:#24292f;font-family:system-ui,sans-serif}.box{max-width:420px;margin:12vh auto;background:white;border:1px solid #d8dee4;border-radius:10px;padding:28px}h1{font-size:22px;margin:0 0 24px}label{display:block;font-size:14px;font-weight:700;margin:14px 0 7px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:6px;border:1px solid #c9d1d9;font:inherit}button{margin-top:22px;background:#0969da;color:white;font-weight:700;border:0;cursor:pointer}#message{font-size:13px;color:#57606a;margin-top:16px}@media(max-width:500px){.box{margin:10vh 16px}}</style><div class="box"><h1>登录生图软件</h1><form id="form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>登录并进入工作台</button><div id="message" role="status">等待登录</div></form></div><script>form.onsubmit=async e=>{e.preventDefault();message.textContent='正在登录...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'登录失败');location.href='/workbench'}catch(e){message.textContent=e.message}};</script></html>
