<style>

.resultCard{border:1px solid #d8dee4;border-radius:8px;padding:8px;background:#fff}.actions,.planActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.planActions button{min-width:120px}
.composer textarea{height:76px;min-height:76px;max-height:76px;resize:none;overflow:auto}.composeTop{display:flex;gap:10px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.hiddenInput{display:none}.preview{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.preview .pic{position:relative;cursor:grab;border:1px solid transparent;border-radius:7px}.preview .pic.dragging{opacity:.45;border-color:#0969da}.preview .pic::after{content:attr(data-order);position:absolute;left:4px;top:4px;background:rgba(9,105,218,.92);color:white;font-size:12px;border-radius:999px;padding:1px 6px}.preview img{width:90px;height:90px;object-fit:contain;background:white;border:1px solid #d8dee4;border-radius:6px}.preview button{position:absolute;right:4px;top:4px;padding:3px 6px}
.sendRow{display:flex;align-items:center;gap:10px}.sendRow button{min-width:110px}.hint{font-size:13px;color:#57606a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;padding:24px;z-index:200}.modal.open{display:flex}.modal img{max-width:96vw;max-height:92vh;object-fit:contain;background:#111}.viewerTools{position:fixed;left:24px;top:76px;display:flex;gap:8px;z-index:80}.viewerTools button{background:rgba(255,255,255,.94);color:#24292f;box-shadow:0 8px 22px rgba(0,0,0,.28)}.viewerBtn{position:fixed;top:50%;transform:translateY(-50%);border-radius:999px;width:46px;height:46px;padding:0;background:rgba(255,255,255,.18);font-size:28px}.viewerPrev{left:24px}.viewerNext{right:24px}.viewerCount{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px}.promptEditorBox{width:min(980px,94vw);height:min(680px,86vh);background:#fff;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.35);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:16px;box-sizing:border-box}.promptEditorHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.promptEditorHead h3{margin:0;font-size:18px}.promptEditorBox textarea{width:100%;height:100%;resize:none;overflow:auto;line-height:1.55;font-size:16px}.promptEditorActions{display:flex;justify-content:flex-end;gap:10px}.editorBox{width:96vw;height:92vh;background:#fff;border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px;padding:12px;box-sizing:border-box}.editorCanvasWrap{position:relative;background:#111;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:auto}.editorCanvasWrap canvas{max-width:100%;max-height:100%;background:#fff}.editorPanel{display:flex;flex-direction:column;gap:10px}.editorPanel .toolrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editorPanel button.active{background:#1f883d}.editorTextInput{position:absolute;z-index:60;width:240px;max-width:280px;box-sizing:border-box;border:2px solid #0969da;border-radius:5px;padding:7px 9px;font:18px system-ui;color:#cf222e;background:white;box-shadow:0 8px 22px rgba(0,0,0,.35)}

<script id="commonHeaderScript">
const status=document.getElementById("status");
function toggleAppMenu(event){event.stopPropagation(); const menu=document.getElementById('appMenuPanel'); if(menu)menu.classList.toggle('open');}
document.addEventListener('click',()=>{const menu=document.getElementById('appMenuPanel'); if(menu)menu.classList.remove('open');});
async function copyLanLink(url){
  try{
    await navigator.clipboard.writeText(url);
    alert("已复制本站链接");
  }catch(_e){
    const input=document.createElement("input");
    input.value=url;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
    alert("已复制本站链接");
  }
}
function imagePathFromUrl(url){
  try{
    const value=String(url||"");
    if(!value||value.startsWith("data:"))return "";
    const parsed=new URL(value,location.href);
    if(parsed.pathname!=="/api/image")return "";
    return parsed.searchParams.get("path")||"";
  }catch(_e){return "";}
}
function downloadImageUrl(url){
  const path=imagePathFromUrl(url);
  if(path){
    const a=document.createElement("a");
    a.href="/api/image?download=1&path="+encodeURIComponent(path);
    a.download="";
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  if(String(url||"").startsWith("data:image/")){
    const a=document.createElement("a");
    a.href=url;
    a.download="image.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
}
function imageDownloadButton(url){
  return `<button class="imageDownloadBtn" onclick="event.stopPropagation();downloadImageUrl(decodeURIComponent('${encodeURIComponent(url||"")}'))">下载</button>`;
}
function visibleImagePaths(){
  const paths=[];
  const seen=new Set();
  document.querySelectorAll("img").forEach(img=>{
    const rect=img.getBoundingClientRect();
    if(rect.width<=0||rect.height<=0)return;
    const path=imagePathFromUrl(img.dataset.src||img.currentSrc||img.src);
    if(path&&!seen.has(path)){seen.add(path);paths.push(path);}
  });
  return paths;
}
async function downloadCurrentPageImages(){
  const paths=visibleImagePaths();
  if(!paths.length){alert("当前页面没有可下载的图片");return;}
  const response=await fetch("/api/images-zip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paths,filename:"当前页面图片包_"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".zip"})});
  if(!response.ok){alert(await response.text()||"下载图片包失败");return;}
  const blob=await response.blob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="当前页面图片包.zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
</script>
<script>
let config={}; let templates=[]; let uploadImages=[]; let pollTimer=null; let currentSessionId=localStorage.getItem('chat-image-session-id-'+String(config.auth_id||''))||''; let viewerImages=[]; let viewerIndex=0; let previewDragIndex=-1; let editorState=null; let lastChatSignature='';
const ui={
  template:document.getElementById('template'), taskMode:document.getElementById('taskMode'), ratioMode:document.getElementById('ratioMode'), quality:document.getElementById('quality'), resolution:document.getElementById('resolution'),
  ratio:document.getElementById('ratio'), count:document.getElementById('count'), images:document.getElementById('images'), folderImages:document.getElementById('folderImages'),
  preview:document.getElementById('preview'), message:document.getElementById('message'), chat:document.getElementById('chat'), sessions:document.getElementById('sessions'),
  status:document.getElementById('status'), modal:document.getElementById('modal')
};
const chatSettingsKey='gpt-image-pil-chat-local-settings';
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>{if(c==="&")return "&amp;"; if(c==="<")return "&lt;"; if(c===">")return "&gt;"; if(c===String.fromCharCode(34))return "&quot;"; return "&#39;";});}
function formatTime(ts){return ts?new Date(Number(ts)*1000).toLocaleString():'-';}
function elapsedText(start){const seconds=Math.max(0,Math.floor(Date.now()/1000-Number(start||Date.now()/1000))); const m=Math.floor(seconds/60); const s=String(seconds%60).padStart(2,'0'); return `${m}:${s}`;}
function statusLabel(status){return ({thinking:'理解需求中',generating:'生成中',queued:'等待生成',planning_done:'准备生成',plan_pending:'等待确认',partial:'部分完成',failed:'失败',cancelled:'已取消'})[status]||status;}
function updateElapsed(){document.querySelectorAll('.elapsed[data-start]').forEach(el=>{el.textContent='用时 '+elapsedText(el.dataset.start);});}
function cacheBust(url,seed){if(!url)return ''; return url+(url.includes('?')?'&':'?')+'v='+encodeURIComponent(seed||Date.now());}
function retryImage(img){const retries=Number(img.dataset.retry||0); if(retries>=4)return; img.dataset.retry=String(retries+1); const original=img.dataset.src||img.src; setTimeout(()=>{img.src=cacheBust(original,Date.now());},600*(retries+1));}
window.cacheBust=cacheBust; window.retryImage=retryImage;
function safeCount(){const n=Number(ui.count.value||1); return Math.max(1,Math.min(8,Number.isFinite(n)?Math.round(n):1));}
function chatSettingsPayload(){return {single_quality:ui.quality.value,single_resolution:ui.resolution.value,single_ratio:ui.ratio.value,single_count:safeCount(),chat_task_mode:ui.taskMode.value,chat_ratio_mode:ui.ratioMode.value};}
async function saveSettings(){
  const payload=chatSettingsPayload();
  localStorage.setItem(chatSettingsKey,JSON.stringify(payload));
  if(!config.settings_editable)return;
  const response=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!response.ok)throw new Error(await response.text()||'保存聊天生图参数失败');
}
async function loadSettings(){
  config=await(await fetch('/api/settings')).json();
  const adminLink=document.getElementById('adminMenuLink');if(adminLink)adminLink.style.display=config.settings_editable?'':'none';
  templates=Array.isArray(config.provider_templates)?config.provider_templates:[];
  let local={}; try{local=JSON.parse(localStorage.getItem(chatSettingsKey)||'{}')||{};}catch(e){local={};}
  ui.template.innerHTML='<option value="">服务器自动分配</option>';
  ui.template.value='';
  ui.template.disabled=true;
  currentSessionId=localStorage.getItem('chat-image-session-id-'+String(config.auth_id||''))||'';
  ui.taskMode.value=local.chat_task_mode||config.chat_task_mode||'confirm';
  ui.ratioMode.value=local.chat_ratio_mode||config.chat_ratio_mode||'smart';
  ui.quality.value=local.single_quality||config.single_quality||config.quality||'high';
  ui.resolution.value=local.single_resolution||config.single_resolution||config.resolution||'2k';
  ui.ratio.value=local.single_ratio||config.single_ratio||'1:1';
  ui.count.value=String(local.single_count||config.single_count||1);
}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader(); r.onload=()=>resolve({name:file.name,data_url:r.result}); r.onerror=reject; r.readAsDataURL(file);});}
async function addFiles(files){const imageFiles=[...files].filter(f=>String(f.type||'').startsWith('image/')); if(!imageFiles.length)return; uploadImages.push(...await Promise.all(imageFiles.map(readFile))); renderPreview(); ui.status.textContent=`已加载 ${uploadImages.length} 张参考图`;}
async function onFiles(e){await addFiles(e.target.files||[]); e.target.value='';}
function renderPreview(){ui.preview.innerHTML=uploadImages.map((item,i)=>`<div class="pic" draggable="true" data-index="${i}" data-order="${i+1}" ondragstart="previewDragStart(event,${i})" ondragover="previewDragOver(event)" ondrop="previewDrop(event,${i})" ondragend="previewDragEnd(event)"><img src="${item.data_url}" onclick="openImage('${item.data_url}')"><button class="ghost" onclick="removeImage(${i})">×</button></div>`).join('');}
function removeImage(i){uploadImages.splice(i,1); renderPreview();}
function previewDragStart(event,index){previewDragIndex=index; event.currentTarget.classList.add('dragging'); event.dataTransfer.effectAllowed='move';}
function previewDragOver(event){event.preventDefault(); event.dataTransfer.dropEffect='move';}
function previewDrop(event,index){event.preventDefault(); if(previewDragIndex<0||previewDragIndex===index)return; const [item]=uploadImages.splice(previewDragIndex,1); uploadImages.splice(index,0,item); previewDragIndex=-1; renderPreview(); ui.status.textContent='已调整待发送图片顺序';}
function previewDragEnd(event){event.currentTarget.classList.remove('dragging'); previewDragIndex=-1;}
function addReferenceDataUrl(dataUrl,name='参考图'){uploadImages.push({name,data_url:dataUrl}); renderPreview(); ui.message.focus(); ui.status.textContent=`已加入参考图，共 ${uploadImages.length} 张。`;}
async function addReferenceFromUrl(url,name='参考图'){try{if(String(url||'').startsWith('data:image/')){addReferenceDataUrl(url,name);return;} const r=await fetch(url); const b=await r.blob(); const dataUrl=await new Promise(resolve=>{const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.readAsDataURL(b);}); addReferenceDataUrl(dataUrl,name);}catch(e){alert('加入参考失败：'+e.message);}}
function imageWithAddRef(url,openPayload=''){const encoded=encodeURIComponent(url||''); const open= openPayload || `openImage(decodeURIComponent('${encoded}'))`; return `<div class="imageWrap"><img src="${url}" onclick="${open}"><button class="addRef" onclick="event.stopPropagation();addReferenceFromUrl(decodeURIComponent('${encoded}'))">加入参考</button>${imageDownloadButton(url)}</div>`;}
function openViewer(urls,index=0){viewerImages=(urls||[]).filter(Boolean); viewerIndex=Math.max(0,Math.min(index,viewerImages.length-1)); renderViewer();}
function openImage(url){openViewer([url],0);}
async function downloadAnswerImages(encodedPaths){
  let paths=[];
