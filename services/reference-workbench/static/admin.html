<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>渠道管理</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#24292f}header{background:white;border-bottom:1px solid #d8dee4;padding:16px 24px;display:flex;gap:24px;align-items:center}header a{color:#0969da;text-decoration:none}main{max-width:1100px;margin:24px auto;padding:0 16px}section{background:white;border:1px solid #d8dee4;border-radius:8px;padding:22px;margin-bottom:18px}h2{font-size:18px;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d1d9;border-radius:6px;font:inherit;background:white}button{padding:10px 16px;border:0;border-radius:6px;font-weight:700;background:#0969da;color:white;cursor:pointer}.ghost{background:#eef1f4;color:#24292f}.row{display:flex;gap:12px;align-items:center;margin-top:16px}.row input{width:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th,td{padding:10px;border-bottom:1px solid #d8dee4;word-break:break-all}.hint,#message{font-size:13px;color:#57606a;line-height:1.5}.tag{background:#eef6ff;color:#0969da;padding:3px 8px;border-radius:12px}.models{display:flex;flex-wrap:wrap;gap:6px;max-height:240px;overflow:auto;margin-top:14px}.models span{font-size:12px;border:1px solid #d8dee4;padding:5px 8px;border-radius:5px}@media(max-width:650px){.grid{grid-template-columns:1fr}table{font-size:11px}}</style><header><strong>渠道管理</strong><a href="/workbench">参考图工作台</a><button class="ghost" id="new">新增渠道</button></header><main><section><h2>上游渠道</h2><table><thead><tr><th>渠道</th><th>上游地址</th><th>可见模型</th><th>生图 / 推理</th><th>状态</th><th></th></tr></thead><tbody id="list"></tbody></table></section><section><h2 id="title">新增渠道</h2><form id="form"><div class="grid"><div><label for="name">渠道名称</label><input id="name" required></div><div><label for="base">上游地址</label><input id="base" placeholder="https://api.example.com/v1" type="url" required></div><div><label for="key">API Key</label><input id="key" type="password" autocomplete="new-password" placeholder="留空保留已保存密钥"></div><div><label>发现模型</label><button type="button" id="discover">保存并自动发现模型</button></div><div><label for="image">生图模型</label><select id="image"><option value="">请选择</option></select></div><div><label for="text">提示词推理模型</label><select id="text"><option value="">请选择</option></select></div></div><div class="row"><input id="active" type="checkbox"><label for="active">设为当前生图渠道</label><button type="submit">保存模型设置</button></div><p class="hint">目录是当前密钥可见模型，不代表每个模型均已通过生图或视觉推理测试。生图通道使用 /images/edits，推理通道使用 /chat/completions；新任务使用保存时的渠道快照。</p><div id="message" role="status"></div><div class="models" id="models"></div></form></section><section><h2>任务记录</h2><table><thead><tr><th>任务</th><th>操作</th><th>状态</th><th>错误</th></tr></thead><tbody id="tasks"></tbody></table><div class="row"><button class="ghost" id="refresh">刷新记录</button></div></section></main><script>
let currentId='',channels=[];const el=id=>document.getElementById(id);const escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.detail||d.error||'请求失败');return d}function options(models){for(const id of ['image','text'])el(id).innerHTML='<option value="">请选择</option>'+models.map(m=>`<option value="${escapeText(m)}">${escapeText(m)}</option>`).join('');el('models').innerHTML=models.map(m=>'<span>'+escapeText(m)+'</span>').join('')}function edit(ch){currentId=ch.id;el('title').textContent='编辑渠道';el('name').value=ch.name;el('base').value=ch.base;el('key').value='';options(ch.models);el('image').value=ch.image_model||'';el('text').value=ch.text_model||'';el('active').checked=Boolean(ch.active);el('message').textContent='发现 '+ch.models.length+' 个模型；密钥已保存，不回显。'}async function load(){const d=await api('/api/admin/channels');channels=d.channels;el('list').innerHTML=channels.map((ch,i)=>`<tr><td>${escapeText(ch.name)}</td><td>${escapeText(ch.base)}</td><td>${ch.models.length}</td><td>${escapeText(ch.image_model||'未选')} / ${escapeText(ch.text_model||'未选')}</td><td>${ch.active?'启用':'未启用'}</td><td><button class="ghost" data-i="${i}">编辑</button></td></tr>`).join('');for(const b of el('list').querySelectorAll('button'))b.onclick=()=>edit(channels[+b.dataset.i]);await refresh()}async function refresh(){const d=await api('/api/admin/tasks');el('tasks').innerHTML=d.tasks.map(t=>`<tr><td>${escapeText(t.id.slice(0,12))}</td><td>${escapeText(t.operation)}</td><td>${escapeText(t.state)}</td><td>${escapeText(t.error)}</td></tr>`).join('')}async function save(discovery){el('message').textContent='正在读取上游模型目录...';try{const body={id:currentId||undefined,name:el('name').value,base:el('base').value,api_key:el('key').value,image_model:el('image').value,text_model:el('text').value,active:el('active').checked};const d=await api('/api/admin/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});edit(d.channel);el('key').value='';el('message').textContent='保存成功，发现 '+d.channel.models.length+' 个密钥可见模型。';await load()}catch(e){el('message').textContent=e.message}}el('form').onsubmit=e=>{e.preventDefault();save(false)};el('discover').onclick=()=>save(true);el('refresh').onclick=()=>refresh().catch(e=>el('message').textContent=e.message);el('new').onclick=()=>{currentId='';el('form').reset();options([]);el('title').textContent='新增渠道';el('message').textContent=''};load().catch(e=>{if(e.message==='请先登录')location.href='/login';else el('message').textContent=e.message});
</script></html>
