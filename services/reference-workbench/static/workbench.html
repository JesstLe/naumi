<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参考图工作台</title>
<style>
:root{--card-min-height:640px;--card-prompt-height:220px;--card-image-height:175px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f6f8;color:#1f2328}
header{height:56px;background:#20242a;color:white;display:flex;align-items:center;padding:0 24px;gap:16px}
header a{color:#cdd9e5;text-decoration:none}
main{max-width:1820px;margin:18px auto;padding:0 300px 0 16px}
section{background:white;border:1px solid #d8dee4;border-radius:8px;padding:16px;margin-bottom:16px}
button{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;background:#0969da;color:white}
button.secondary{background:#57606a}
button.ghost{background:#eef1f4;color:#24292f}
button.small{padding:7px 10px;font-size:13px}
button.primaryAction{font-size:16px;padding:13px 22px;box-shadow:0 3px 10px rgba(9,105,218,.24)}
button.cardGenerate{width:100%;margin:5px 0 0;padding:11px 10px;background:#1f883d;font-size:15px}
input,select,textarea{box-sizing:border-box;padding:9px;border:1px solid #c9d1d9;border-radius:6px;font:inherit;background:white}
textarea{width:100%;min-height:72px;resize:vertical}
label{font-size:13px;font-weight:700;color:#24292f}
.hint{color:#57606a;font-size:13px;line-height:1.5}
.topgrid{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.productPanel{border:1px solid #d8dee4;border-radius:8px;overflow:hidden;background:#fafbfc}
.productGallery{height:310px;background:#fff;border-bottom:1px solid #d8dee4;display:grid;grid-template-columns:1fr;gap:0}
.productGallery.multi{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;padding:6px;box-sizing:border-box}
.productGallery img{width:100%;height:100%;object-fit:contain;background:#fff;cursor:pointer;border-radius:4px}
.productGallery.multi img{background:#f6f8fa;border:1px solid #d8dee4}
.productPanel .body{padding:12px}
.productName{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings{display:grid;grid-template-columns:1.3fr 1fr 1fr .7fr .7fr .7fr;gap:10px;align-items:end}
.settings .wide{grid-column:1 / -1}
.settings .providerPanel{grid-column:1 / -1;background:#f6f8fa;border:1px solid #d8dee4;border-radius:8px;padding:10px}
.settings .compactRow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sizeControl{display:flex;align-items:center;gap:6px;color:#24292f;font-size:13px;font-weight:700;background:#f6f8fa;border:1px solid #d8dee4;border-radius:6px;padding:6px 8px}
.sizeControl input{width:82px;padding:7px}
.status{font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;background:#f6f8fa;border:1px solid #d8dee4;border-radius:6px;padding:10px}
.workarea{position:relative;min-height:380px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.card{border:2px solid #d8dee4;border-radius:8px;background:#fff;overflow:hidden;position:relative;min-height:var(--card-min-height)}
.card.selected{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.16)}
.selectZone{position:absolute;left:8px;top:8px;width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.92);border:2px solid #8c959f;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer}
.card.selected .selectZone{background:#0969da;border-color:#0969da}
.selectZone input{width:18px;height:18px;pointer-events:none}
.body{padding:7px 10px 12px}
.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:#57606a;margin:4px 0 8px}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef1f4;color:#57606a;font-size:12px;font-weight:700}
.badge.running,.badge.waiting,.badge.editing{background:#fff8c5;color:#7d4e00}
.badge.done,.badge.skipped,.badge.infer_done{background:#dafbe1;color:#116329}
.badge.failed{background:#ffebe9;color:#cf222e}
.badge.maybe_submitted{background:#ddf4ff;color:#0969da}
.cardActions{display:flex;gap:8px;align-items:center;margin:7px 0 4px}
.cardActions select{flex:1}
.card textarea.prompt{height:var(--card-prompt-height);font-size:15px;line-height:1.45;margin-top:4px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 0}
.resultPanel .meta{margin:0 0 5px}
.result img{width:100%;height:var(--card-image-height);object-fit:contain;background:#f6f8fa;border:1px solid #d8dee4;border-radius:6px;cursor:pointer}
.downloadableImage{position:relative}
.imageDownloadBtn{position:absolute;left:7px;bottom:7px;display:none;border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer;background:rgba(9,105,218,.94);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:6}
.downloadableImage:hover .imageDownloadBtn{display:block}
.placeholder{height:var(--card-image-height);display:flex;align-items:center;justify-content:center;background:#f6f8fa;border:1px solid #d8dee4;border-radius:6px;color:#57606a}
.promptLabel{margin-top:4px;margin-bottom:3px}
.marquee{position:fixed;border:1px solid #0969da;background:rgba(9,105,218,.14);pointer-events:none;display:none;z-index:30}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:flex-start;justify-content:center;padding:12px;z-index:40;overflow:auto}
.modal.open{display:flex}
.modal.compareOpen{align-items:center;padding:8px;overflow:hidden}
.modalBox{background:white;border-radius:8px;max-width:96vw;max-height:94vh;overflow:auto;padding:14px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;width:calc(100vw - 16px);height:calc(100vh - 16px);max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:hidden}
.pair img{width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;background:#111;border-radius:6px}
.editor{display:grid;grid-template-columns:minmax(360px,1fr) 360px;gap:14px;width:94vw;max-height:92vh}
.canvasWrap{background:#111;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:520px}
#editCanvas{max-width:100%;max-height:82vh;background:white;cursor:crosshair}
.canvasWrap{position:relative}
.textEditInput{position:absolute;z-index:10;min-width:260px;border:2px solid #0969da;border-radius:4px;padding:6px 8px;font:18px system-ui;background:white;color:#cf222e;box-shadow:0 4px 16px rgba(0,0,0,.22)}
.editPanel{display:flex;flex-direction:column;gap:10px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap}
.toolrow button.active{background:#1f883d}
.errorBox{margin-top:8px;color:#cf222e;background:#ffebe9;border:1px solid #ff8182;border-radius:6px;padding:8px;white-space:pre-wrap}
.projectDock{position:fixed;right:14px;top:74px;width:260px;max-height:calc(100vh - 92px);overflow:auto;background:white;border:1px solid #d8dee4;border-radius:8px;padding:12px;box-shadow:0 8px 26px rgba(27,31,36,.12);z-index:12}
.projectDock h3{margin:0 0 8px;font-size:15px}
.projectItem{border:1px solid #d8dee4;border-radius:8px;padding:9px;margin-bottom:8px;background:#fafbfc}
.projectItem strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projectItem .path{font-size:12px;color:#57606a;word-break:break-all;margin:4px 0 8px}
.projectItem .buttons{display:flex;gap:6px}
.projectItem button{padding:6px 8px;font-size:12px}
@media(max-width:1500px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1180px){main{padding:0 16px}.projectDock{position:static;width:auto;max-height:none;margin:0 16px 16px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}

@media(max-width:680px){.settings{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style>

<script id="commonHeaderScript">
function toggleAppMenu(event){event.stopPropagation(); const menu=document.getElementById('appMenuPanel'); if(menu)menu.classList.toggle('open');}
document.addEventListener('click',()=>{const menu=document.getElementById('appMenuPanel'); if(menu)menu.classList.remove('open');});
async function copyLanLink(url){
  try{
    await navigator.clipboard.writeText(url);
    alert("已复制局域网链接");
  }catch(_e){
    const input=document.createElement("input");
    input.value=url;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
    alert("已复制局域网链接");
  }
}
function imagePathFromUrl(url){
  try{
    const value=String(url||"");
    if(!value||value.startsWith("data:"))return "";
    const parsed=new URL(value,location.href);
    if(parsed.pathname!=="/api/image")return "";
    return parsed.searchParams.get("path")||"";
  }catch(_e){return "";}
}
function downloadImageUrl(url){
  const path=imagePathFromUrl(url);
  if(path){
    const a=document.createElement("a");
    a.href="/api/image?download=1&path="+encodeURIComponent(path);
    a.download="";
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  if(String(url||"").startsWith("data:image/")){
    const a=document.createElement("a");
    a.href=url;
    a.download="image.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
}
function imageDownloadButton(url){
  return `<button class="imageDownloadBtn" onclick="event.stopPropagation();downloadImageUrl(decodeURIComponent('${encodeURIComponent(url||"")}'))">下载</button>`;
}
function visibleImagePaths(){
  const paths=[];
  const seen=new Set();
  document.querySelectorAll("img").forEach(img=>{
    const rect=img.getBoundingClientRect();
    if(rect.width<=0||rect.height<=0)return;
    const path=imagePathFromUrl(img.dataset.src||img.currentSrc||img.src);
    if(path&&!seen.has(path)){seen.add(path);paths.push(path);}
  });
  return paths;
}
async function downloadCurrentPageImages(){
  const paths=visibleImagePaths();
  if(!paths.length){alert("当前页面没有可下载的图片");return;}
  const response=await fetch("/api/images-zip",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paths,filename:"当前页面图片包_"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".zip"})});
  if(!response.ok){alert(await response.text()||"下载图片包失败");return;}
  const blob=await response.blob();
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="当前页面图片包.zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
</script>
<script>
let items=[]; let drag=null; let selectedVersions={}; let selectedRefs=null; let editState=null; let projects=[]; let providerTemplates=[]; let promptOverrides={};
const projectStoreKey="gpt-image-pil-workbench-projects";
const promptStoreKey="gpt-image-pil-workbench-prompts";
const promptStoreVersionKey="gpt-image-pil-workbench-prompts-version";
const promptStoreVersion="3";
const cardHeightStoreKey="gpt-image-pil-card-height";
const inferTaskStoreKey="gpt-image-pil-infer-tasks";
const rootStoreKey="gpt-image-pil-workbench-root";
const settingsStoreKey="gpt-image-pil-workbench-settings";
const settingsStoreVersionKey="gpt-image-pil-workbench-settings-version";
const settingsStoreVersion="2";
const status=document.getElementById("status");
const fields=["active_provider_template","mode","quality","resolution","timeout","sku_refs_dir_name","prompt","prompt_infer_instruction","force","card_height"];
const statusText={idle:"待生成",waiting:"等待中",running:"生成中",inferring:"推理中",infer_done:"推理完成",editing:"二次修改中",done:"完成",skipped:"已存在",failed:"失败",maybe_submitted:"可能已提交"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function valBool(v){return v===true||v==="true";}
function clampNumber(value,min,max){const number=Number(value); if(!Number.isFinite(number))return min; return Math.max(min,Math.min(max,number));}
function applyCardHeight(value,save=true){
  const height=clampNumber(value||640,560,1000);
  const delta=height-640;
  const promptHeight=Math.max(170,Math.round(220+delta*0.7));
  const imageHeight=Math.max(145,Math.round(175+delta*0.2));
  document.documentElement.style.setProperty("--card-min-height",height+"px");
  document.documentElement.style.setProperty("--card-prompt-height",promptHeight+"px");
  document.documentElement.style.setProperty("--card-image-height",imageHeight+"px");
  if(card_height)card_height.value=String(height);
  if(save)localStorage.setItem(cardHeightStoreKey,String(height));
}
function loadCardHeight(value){applyCardHeight(value||localStorage.getItem(cardHeightStoreKey)||640,false);}
function openInferInstructionSettings(){
  const current=prompt_infer_instruction.value||"";
  modal.classList.remove("compareOpen");
  modal.innerHTML=`<div class="modalBox" onclick="event.stopPropagation()" style="width:min(760px,92vw)"><h3 style="margin-top:0">推理图片提示词指令</h3><p class="hint">这里不会显示或保存 API Key，只是告诉推理模型如何根据产品图和参考图总结提示词。</p><textarea id="inferInstructionEditor" style="width:100%;min-height:260px">${esc(current)}</textarea><div class="toolbar"><button onclick="saveInferInstructionFromModal()">保存指令</button><button class="ghost" onclick="closeModal()">取消</button></div></div>`;
  modal.classList.add("open");
}
function saveInferInstructionFromModal(){
  const editor=document.getElementById("inferInstructionEditor");
  prompt_infer_instruction.value=editor?editor.value:"";
  writeLocalWorkbenchSettings();
  closeModal();
  status.textContent="推理指令已保存到当前浏览器。";
}
function readPromptOverrides(){
  if(localStorage.getItem(promptStoreVersionKey)!==promptStoreVersion){
    localStorage.removeItem(promptStoreKey);
    localStorage.setItem(promptStoreVersionKey,promptStoreVersion);
    promptOverrides={};
    return;
  }
  try{promptOverrides=JSON.parse(localStorage.getItem(promptStoreKey)||"{}"); if(!promptOverrides||typeof promptOverrides!=="object"||Array.isArray(promptOverrides))promptOverrides={};}catch(e){promptOverrides={};}

    const key=versionsKey(it);

      const result=card.querySelector(".result");
      if(result)result.innerHTML=resultHtml(it,i);

async function downloadWorkbenchZip(kind){
  const selected=selectedDownloadPayload();
  if(!selected.length){alert("请先选择要下载的卡片");return;}
  const includeOriginal=kind==="original"||kind==="both";
  const includeGenerated=kind==="generated"||kind==="both";
  if(includeGenerated&&!selected.some(x=>x.version_path)){
    if(!confirm("选中的卡片里没有生成图，是否继续下载可用内容？"))return;
  }
  status.textContent="正在打包下载图片...";
  const response=await fetch("/api/workbench/download-zip",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      items:selected,
      workbench_root:currentRoot(),
      config:workbenchRequestConfig(),
      include_original:includeOriginal,
      include_generated:includeGenerated
    })
  });
  if(!response.ok){
    const text=await response.text();
    status.textContent="下载失败："+text;
    alert(text||"下载失败");
    return;
  }
  const blob=await response.blob();
  let filename=(projectName(currentRoot())||"当前产品")+"_生成.zip";
  const disposition=response.headers.get("Content-Disposition")||"";
  const match=disposition.match(/filename\\*=UTF-8''([^;]+)/);
  if(match)filename=decodeURIComponent(match[1]);
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  status.textContent="图片包已开始下载："+filename;
}

  }catch(e){return;}
  if(!r.ok){
    const text=await r.text();

    return;
  }

async function pollInferResults(task){
  if(currentRoot()!==task.root){
    status.textContent="提示词推理已在后台进行，切换回来即可看到结果。";
    return;
  }
  let list=[];
  try{
    const data=await(await fetch(workbenchItemsUrl())).json();
    list=data.items||[];
  }catch(e){}
  const byRef=new Map(list.map(x=>[x.ref_path,x]));
  let pending=0;
  for(const selectedItem of task.selected){
    const it=byRef.get(selectedItem.ref_path);
    if(!it)continue;
    const infer=it.infer||{};
    if(infer.status==="failed"||infer.status==="maybe_submitted"){status.textContent=infer.error||"推理失败";alert(status.textContent);return;}
    if(infer.status==="inferring"){pending++;continue;}
    if(infer.status==="done"&&infer.prompt){
      setPromptOverride(selectedItem.ref_path,infer.prompt);
    }
  }
  const nextItems=mergePromptOverrides(list);
  if(canPatchCards(nextItems)){items=nextItems; patchCards(nextItems);}
  else{items=nextItems; render();}
  for(const selectedItem of task.selected){
    const it=byRef.get(selectedItem.ref_path);
    if(!it)continue;
    const infer=it.infer||{};
    if(infer.status==="done"&&infer.prompt){
      const card=document.querySelector(`.card[data-ref="${CSS.escape(selectedItem.ref_path)}"]`);
      const ta=card&&card.querySelector(".prompt");
      if(ta)ta.value=infer.prompt;
    }
  }
  if(pending>0){
    status.textContent="正在推理 "+pending+" 条提示词...";
    setTimeout(()=>pollInferResults(task),800);
  }else{
    status.textContent="提示词推理完成";
    alert("所有提示词推理完成");
  }
}

let workbenchRefreshPromise=null;
async function refreshLoopOnce(){
  if(workbenchRefreshPromise)return workbenchRefreshPromise;
  workbenchRefreshPromise=(async()=>{
    const data=await fetchJsonChecked(workbenchItemsUrl());
    const nextItems=mergePromptOverrides(data.items||items);
    if(canPatchCards(nextItems)){
      items=nextItems;
      patchCards(nextItems);

  })();

}

  modal.classList.remove("compareOpen");
  modal.innerHTML=`<div class="modalBox" onclick="event.stopPropagation()" style="width:min(820px,94vw)"><h3 style="margin-top:0">版本记录</h3>${rows.map(([k,val])=>val?`<div style="margin:10px 0"><strong>${esc(k)}</strong><div class="status">${esc(val)}</div></div>`:"").join("")}<button class="secondary" onclick="closeModal()">关闭</button></div>`;
  modal.classList.add("open");
}
function openEditor(i){
  const it=items[i], v=activeVersion(it); if(!it||!v)return;
  modal.classList.remove("compareOpen");
  editState={index:i, item:it, version:v, tool:"arrow", drawing:false, start:null, base:null, objects:[], history:[]};
  const versionOptions=(it.versions||[]).map(x=>`<option value="${esc(x.path)}" ${x.path===v.path?"selected":""}>${esc(x.label)}</option>`).join("");
  modal.innerHTML=`<div class="modalBox" onclick="event.stopPropagation()"><div class="editor"><div class="canvasWrap"><canvas id="editCanvas"></canvas></div><div class="editPanel">
    <strong>结果标注后二次生成</strong>
    <div class="hint">这次只发送“当前生成结果图 + 带标注的结果图 + 新提示词”，不会再发送产品图和同行参考图。</div>
    <label>切换版本</label><select id="editVersionSelect" onchange="setEditorVersion(this.value)">${versionOptions}</select>
    <div id="versionHint" class="hint"></div>
    <div class="toolrow"><button id="toolArrow" class="active" onclick="setTool('arrow')">箭头</button><button id="toolRect" class="ghost" onclick="setTool('rect')">框选</button><button id="toolText" class="ghost" onclick="setTool('text')">文字</button><button class="ghost" onclick="undoCanvas()">撤销上一步</button><button class="ghost" onclick="resetCanvas()">清空标注</button></div>
    <div class="hint">文字工具：点击图片位置后输入文字，按 Enter 确认；已有文字可以直接拖动位置。</div>
    <label>二次生成提示词</label><textarea id="editPrompt" style="min-height:150px">根据标注修改这张图片，保持整体风格和排版质感，生成新的版本。</textarea>
    <button onclick="submitEdit()">发送二次生成</button>
    <button class="secondary" onclick="closeModal()">关闭</button>
    <div id="editMsg" class="status">等待操作</div>
  </div></div></div>`;
  modal.classList.add("open");
  loadEditorVersion(v);
}
function setEditorVersion(path){
  if(!editState)return;
  const found=(editState.item.versions||[]).find(v=>v.path===path);
  if(!found)return;
  editState.version=found;
  selectedVersions[editState.item.ref_path]=path;
  loadEditorVersion(found);
}
function outgoingEditForVersion(version){
  if(!version||!editState)return null;
  return (editState.item.versions||[]).find(next=>{
    const meta=next.meta||{};
    return meta.kind==="edit" && meta.source_path===version.path && meta.annotated_url;
  }) || null;
}
function loadEditorVersion(v){
  if(!editState||!v)return;
  const outgoing=outgoingEditForVersion(v);
  const m=outgoing ? (outgoing.meta||{}) : (v.meta||{});
  const promptText=outgoing ? (m.prompt||"") : "根据标注修改这张图片，保持整体风格和排版质感，生成新的版本。";
  if(editPrompt) editPrompt.value=promptText;
  if(versionHint){
    versionHint.textContent=outgoing
      ? `当前：${v.label||""}，显示它当时生成 ${outgoing.label||"下一版"} 的标注和提示词`
      : `当前：${v.label||""}，显示当前版本原图，可继续标注生成下一版`;
  }
  const annotatedUrl=outgoing&&m.annotated_url?`${m.annotated_url}&t=${encodeURIComponent(outgoing.mtime||"0")}`:"";
  loadEditCanvas(annotatedUrl||versionUrl(v));
}
function closeModal(){modal.classList.remove("open","compareOpen"); modal.innerHTML="";}
function setTool(tool){
  if(!editState)return;
  editState.tool=tool;
  for(const [id,name] of [["toolArrow","arrow"],["toolRect","rect"],["toolText","text"]]){
    const el=document.getElementById(id);
    if(el){el.classList.toggle("active",tool===name);el.classList.toggle("ghost",tool!==name);}
  }
  if(editMsg)editMsg.textContent=tool==="text"?"点击图片添加文字，拖动已有文字可移动位置":tool==="rect"?"拖动鼠标框选需要修改的区域":"拖动鼠标绘制箭头";
}
function canvasPoint(e){const c=editCanvas,r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};}
function canvasScreenPoint(p){const c=editCanvas,r=c.getBoundingClientRect(); return {x:r.left+p.x*r.width/c.width,y:r.top+p.y*r.height/c.height};}
function canvasLocalPoint(p){const c=editCanvas,wrap=document.querySelector(".canvasWrap"),cr=c.getBoundingClientRect(),wr=wrap.getBoundingClientRect();return {x:cr.left-wr.left+p.x*cr.width/c.width,y:cr.top-wr.top+p.y*cr.height/c.height};}
function annotationFontSize(){return Math.max(28,editCanvas.width/28);}
function textMetrics(obj){const c=editCanvas,ctx=c.getContext("2d"),size=obj.size||annotationFontSize();ctx.save();ctx.font=size+"px sans-serif";const w=ctx.measureText(obj.text||"").width;ctx.restore();return {x:obj.x,y:obj.y,w,h:size*1.25};}
function hitText(p){if(!editState||!editState.objects)return -1;for(let i=editState.objects.length-1;i>=0;i--){const obj=editState.objects[i];if(obj.kind!=="text")continue;const m=textMetrics(obj);if(p.x>=m.x&&p.x<=m.x+m.w&&p.y>=m.y&&p.y<=m.y+m.h)return i;}return -1;}
function drawArrow(ctx,a,b){ctx.save();ctx.strokeStyle="#ff1f1f";ctx.fillStyle="#ff1f1f";ctx.lineWidth=Math.max(4,editCanvas.width/260);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();const ang=Math.atan2(b.y-a.y,b.x-a.x),len=Math.max(18,editCanvas.width/45);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-len*Math.cos(ang-Math.PI/6),b.y-len*Math.sin(ang-Math.PI/6));ctx.lineTo(b.x-len*Math.cos(ang+Math.PI/6),b.y-len*Math.sin(ang+Math.PI/6));ctx.closePath();ctx.fill();ctx.restore();}
function drawRect(ctx,a,b){ctx.save();ctx.strokeStyle="#ff1f1f";ctx.lineWidth=Math.max(4,editCanvas.width/260);ctx.setLineDash([Math.max(12,editCanvas.width/80),Math.max(8,editCanvas.width/120)]);ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));ctx.restore();}
function drawTextObject(ctx,obj,selected=false){ctx.save();const size=obj.size||annotationFontSize();ctx.font=size+"px sans-serif";ctx.textBaseline="top";ctx.fillStyle="#ff1f1f";ctx.strokeStyle="rgba(255,255,255,.92)";ctx.lineWidth=Math.max(3,size/10);ctx.strokeText(obj.text,obj.x,obj.y);ctx.fillText(obj.text,obj.x,obj.y);if(selected){const m=textMetrics(obj);ctx.strokeStyle="#0969da";ctx.setLineDash([8,6]);ctx.lineWidth=Math.max(2,editCanvas.width/500);ctx.strokeRect(m.x-4,m.y-4,m.w+8,m.h+8);}ctx.restore();}
function drawObject(ctx,obj,selected=false){if(obj.kind==="arrow")drawArrow(ctx,obj.start,obj.end);else if(obj.kind==="rect")drawRect(ctx,obj.start,obj.end);else if(obj.kind==="text")drawTextObject(ctx,obj,selected);}
function redrawEditCanvas(preview=null){const c=editCanvas,ctx=c.getContext("2d");if(!editState||!editState.image)return;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(editState.image,0,0,c.width,c.height);(editState.objects||[]).forEach((obj,i)=>drawObject(ctx,obj,editState.selectedText===i));if(preview)drawObject(ctx,preview,true);}
function cloneObjects(){return JSON.parse(JSON.stringify(editState.objects||[]));}
function pushCanvasHistory(){if(editState)editState.history.push(cloneObjects());}
function loadEditCanvas(src){const img=new Image();img.onload=()=>{const c=editCanvas;c.width=img.naturalWidth;c.height=img.naturalHeight;editState.image=img;editState.objects=[];editState.history=[];editState.drawing=null;editState.draggingText=null;editState.selectedText=-1;redrawEditCanvas();bindCanvas();};img.src=src;}
function createTextInputAt(p){removeTextInput();const wrap=document.querySelector(".canvasWrap");const pos=canvasLocalPoint(p);const input=document.createElement("input");input.className="textEditInput";input.value="";input.placeholder="输入标注文字，按 Enter 确认";input.style.left=Math.max(6,pos.x)+"px";input.style.top=Math.max(6,pos.y)+"px";wrap.appendChild(input);let done=false;function commit(){if(done)return;done=true;const value=input.value.trim();removeTextInput();if(!value)return;pushCanvasHistory();editState.objects.push({kind:"text",x:p.x,y:p.y,text:value,size:annotationFontSize()});editState.selectedText=editState.objects.length-1;redrawEditCanvas();}input.addEventListener("mousedown",e=>e.stopPropagation());input.addEventListener("click",e=>e.stopPropagation());input.addEventListener("keydown",e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){done=true;removeTextInput();}});input.addEventListener("blur",commit);requestAnimationFrame(()=>input.focus());}
function removeTextInput(){document.querySelectorAll(".textEditInput").forEach(el=>el.remove());}
function bindCanvas(){
  const c=editCanvas;
  c.onmousedown=e=>{
    const p=canvasPoint(e);
    removeTextInput();
    if(editState.tool==="text"){
      e.preventDefault();
      e.stopPropagation();
      const hit=hitText(p);
      if(hit>=0){
        pushCanvasHistory();
        const obj=editState.objects[hit];
        editState.selectedText=hit;
        editState.draggingText={index:hit,dx:p.x-obj.x,dy:p.y-obj.y};
        redrawEditCanvas();
      }else{
        editState.selectedText=-1;
        redrawEditCanvas();
        createTextInputAt(p);
      }
      return;
    }
    pushCanvasHistory();
    editState.drawing={kind:editState.tool,start:p,end:p};
  };
  c.onmousemove=e=>{
    const p=canvasPoint(e);
    if(editState.draggingText){
      const obj=editState.objects[editState.draggingText.index];
      obj.x=p.x-editState.draggingText.dx;
      obj.y=p.y-editState.draggingText.dy;
      redrawEditCanvas();
      return;
    }
    if(editState.drawing){
      editState.drawing.end=p;
      redrawEditCanvas(editState.drawing);
    }
  };
  c.onmouseup=e=>{
    const p=canvasPoint(e);
    if(editState.draggingText){editState.draggingText=null;redrawEditCanvas();return;}
    if(!editState.drawing)return;
    const drawing=editState.drawing;
    drawing.end=p;
    editState.drawing=null;
    if(Math.hypot(drawing.end.x-drawing.start.x,drawing.end.y-drawing.start.y)>6){
      editState.objects.push(drawing);
    }else{
      editState.history.pop();
    }
    redrawEditCanvas();
  };
  c.onmouseleave=()=>{if(editState.draggingText){editState.draggingText=null;redrawEditCanvas();} if(editState.drawing){editState.drawing=null;redrawEditCanvas();}};
}
function undoCanvas(){if(editState&&editState.history&&editState.history.length){editState.objects=editState.history.pop();editState.selectedText=-1;redrawEditCanvas();}}
function resetCanvas(){if(editState){pushCanvasHistory();editState.objects=[];editState.selectedText=-1;redrawEditCanvas();}}
async function submitEdit(){
  if(!editState)return;
  removeTextInput();
  redrawEditCanvas();
  editMsg.textContent="正在提交二次生成...";
  items[editState.index].status="editing";

  await saveSettings();
  const body={ref_path:editState.item.ref_path,result_path:editState.version.path,annotated_data_url:editCanvas.toDataURL("image/png"),prompt:editPrompt.value,workbench_root:currentRoot(),config:workbenchRequestConfig()};
  const r=await fetch("/api/workbench/edit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const text=await r.text();
  if(!r.ok){editMsg.textContent=text;return;}
  editMsg.textContent="二次生成已提交，等待返回结果";
  await refreshLoopOnce();
  refreshLoop();
}
function rectsOverlap(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)}
workarea.addEventListener("mousedown",e=>{if(e.target.closest("textarea")||e.target.closest("button")||e.target.closest("select")||e.target.closest(".selectZone"))return; drag={x:e.clientX,y:e.clientY}; marquee.style.display="block"; marquee.style.left=e.clientX+"px"; marquee.style.top=e.clientY+"px"; marquee.style.width="0px"; marquee.style.height="0px"; e.preventDefault();});
window.addEventListener("mousemove",e=>{if(!drag)return; const x1=Math.min(drag.x,e.clientX),y1=Math.min(drag.y,e.clientY),x2=Math.max(drag.x,e.clientX),y2=Math.max(drag.y,e.clientY); marquee.style.left=x1+"px"; marquee.style.top=y1+"px"; marquee.style.width=(x2-x1)+"px"; marquee.style.height=(y2-y1)+"px"; const sel={left:x1,top:y1,right:x2,bottom:y2}; document.querySelectorAll(".card").forEach(c=>setCardSelected(c,rectsOverlap(sel,c.getBoundingClientRect())));});
window.addEventListener("mouseup",()=>{if(drag){drag=null; marquee.style.display="none";}});
(async()=>{
  readProjects();
  readPromptOverrides();

})();

workbench_root.addEventListener("paste",()=>setTimeout(scheduleRootLoad,0));
mode.addEventListener("change",()=>saveAndLoad());
document.getElementById("prompt").addEventListener("input",()=>{syncDefaultPromptToCards();scheduleSaveSettings();});
card_height.addEventListener("input",()=>applyCardHeight(card_height.value,true));

for(const id of ["quality","resolution","timeout","force"]){
  const el=document.getElementById(id);
