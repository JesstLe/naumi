<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队排期 · 服务端验收</title>
<style>
:root{font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;color:#23344d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select,input{border:1px solid #dce3ed;border-radius:7px;background:white;color:inherit;padding:7px 10px}button{cursor:pointer}button:hover{border-color:#799bfa}button:disabled{opacity:.45;cursor:default}.primary{background:#3469e8;border-color:#3469e8;color:white}header{background:white;border-bottom:1px solid #e4eaf2;padding:20px 32px;display:flex;align-items:center;gap:16px}header h1{font-size:20px;margin:0}header small{color:#8391a4}header select{margin-left:auto}.tag{font-size:12px;padding:3px 9px;background:#eaf1ff;color:#4771bb;border-radius:5px}main{padding:24px 32px;max-width:1540px;margin:auto}.topline{display:flex;align-items:center;gap:12px;margin-bottom:18px}.topline strong{font-size:17px}.meta{color:#8190a5;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}.panel{background:white;border:1px solid #e1e8f2;border-radius:11px;overflow:hidden}.tabs{display:flex;gap:4px;padding:11px 16px;border-bottom:1px solid #e8edf5;overflow:auto}.tabs button{border-color:transparent;white-space:nowrap}.tabs button.active{background:#edf3ff;color:#3265d5;font-weight:bold}.toolbar{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid #e8edf5}.toolbar .hint{margin-left:auto;color:#74849b;font-size:12px}.content{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:480px}.preview{padding:20px;overflow:auto}.preview h2,.settings h2{font-size:14px;margin:0 0 14px}.scroll{overflow:auto;max-height:380px}table{border-collapse:collapse;font-size:13px;width:100%}th,td{text-align:left;white-space:nowrap;padding:12px;border-bottom:1px solid #edf0f5}th{background:#f7f9fc;color:#718098;font-weight:500}tbody tr:last-child td{border:0}.settings{padding:20px;border-left:1px solid #e6ecf4;background:#fcfdff}.settings label{display:block;margin-top:12px;font-size:12px;color:#75859b}.settings input,.settings select{width:100%;margin-top:5px;background:white}.settings input[type=checkbox]{width:auto}.settings .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{padding:11px 18px;background:#edf8f3;color:#368561;border:1px solid #d7eee2;border-radius:8px;margin:16px 0;min-height:44px}.status.error{background:#fff1ef;color:#c35143;border-color:#f7ddd8}.audit{margin-top:20px;padding:20px}.audit h2{font-size:14px;margin:0 0 10px}.board{display:flex;gap:12px;min-width:650px}.lane{background:#f6f8fc;border:1px solid #e8edf5;padding:12px;border-radius:8px;min-width:180px;flex:1}.lane strong{font-size:12px;font-weight:500;color:#587194}.card{padding:12px;background:white;border:1px solid #e5eaf3;border-radius:7px;margin-top:12px}.card small{display:block;color:#8b96a6;margin-top:8px}.dots{color:#90a0b4}.note{font-size:12px;color:#8592a4;margin-top:18px}.settings button{margin-top:18px;width:100%}.blank{color:#8996a8;padding:30px 0}.row-blue{background:#f3f7ff}.row-yellow{background:#fffbef}@media(max-width:900px){header{padding:14px;flex-wrap:wrap}header h1{font-size:17px}header small{display:none}main{padding:16px 12px}.topline{flex-wrap:wrap}.actions{width:100%;margin-left:0}.content{grid-template-columns:minmax(0,1fr)}.settings{border-left:0;border-top:1px solid #e6ecf4}.toolbar{flex-wrap:wrap}.toolbar .hint{margin-left:0}}
</style></head><body>
<header><h1>团队排期</h1><span class="tag">服务端验收</span><small>独立 PostgreSQL · 合成账号与示例行</small><select id="identity" aria-label="验收身份"><option value="lead">陈序 · 主管</option><option value="lead2">沈悦 · 主管</option><option value="designer">许知 · 设计师</option></select></header>
<main><div class="topline"><strong>电商设计制作任务</strong><span id="versions" class="meta"></span><div class="actions"><button id="reload">重新载入</button><button id="personal">保存我的视图</button><button id="draft">保存团队草稿</button><button id="publish" class="primary">发布团队模板</button></div></div>
<div class="panel"><nav class="tabs" id="tabs"></nav><div class="toolbar"><span id="viewtitle"></span><span class="tag" id="draftmark"></span><span class="hint">配置来自服务端；示例行仅用于检查布局</span></div><div class="content"><section class="preview"><h2 id="previewtitle">布局预览</h2><div id="preview"></div><div class="note">发布与恢复仅修改布局配置，不修改任务事实。</div></section><aside class="settings"><h2>视图设置</h2><label>显示方式<select id="renderer"><option value="table">表格</option><option value="board">看板</option></select></label><div class="twocol"><label>密度<select id="density"><option value="compact">紧凑</option><option value="normal">标准</option><option value="relaxed">宽松</option></select></label><label>分组<select id="group"><option value="none">不分组</option><option value="assignee">执行人</option><option value="owner">需求方</option></select></label></div><label>首列名称<input id="columnLabel" maxlength="24"></label><label>首列宽度<input id="columnWidth" type="number" min="240" max="420"></label><label>变更原因<input id="reason" value="调整团队排期布局" maxlength="200"></label><button id="restore">恢复初始布局为新版本</button><div class="note" id="privacy"></div></aside></div></div>
<div id="status" class="status" role="status">正在连接隔离验收服务…</div><section class="panel audit"><h2>团队配置变更</h2><div id="audit"></div></section></main>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let team,book,viewId='team',config,personalVersion=0,loadedVersion=0;
$('#identity').value=sessionStorage.getItem('schedule-fixture-user')||'lead';
const manager=()=>$('#identity').value!=='designer';
async function api(path,body){const s=await(await fetch('/fixture/session?subject='+$('#identity').value)).json();team=s.teamId;const r=await fetch(path.replace('TEAM',team),{method:body?'POST':'GET',headers:{authorization:'Bearer '+s.token,...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const v=await r.json();if(!r.ok)throw new Error(v.error?.code||'HTTP_'+r.status);return v;}
function status(text,error=false){$('#status').textContent=text;$('#status').className='status'+(error?' error':'');}
function current(){return book.views.find(v=>v.id===viewId&&!v.archived)||book.views.find(v=>!v.archived);}
async function load(){try{book=(await api('/v1/teams/TEAM/scheduling')).workbook;loadedVersion=book.version;viewId=current().id;await selectView(viewId);await audit();status('已从 PostgreSQL 载入配置 · 工作簿 v'+book.version);}catch(e){status(e.message,true);}}
async function selectView(id){viewId=id;const v=current(),p=(await api('/v1/teams/TEAM/scheduling/personal/'+id)).personal;personalVersion=p.version;config=structuredClone(v.draft?.config||p.config||v.published);render();}
function render(){const v=current();$('#versions').textContent='工作簿 v'+book.version+' / 视图 v'+v.revision;$('#tabs').innerHTML=book.views.filter(v=>!v.archived).map(v=>'<button data-view="'+v.id+'" class="'+(v.id===viewId?'active':'')+'">'+esc(v.name)+'</button>').join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>selectView(b.dataset.view).catch(e=>status(e.message,true)));$('#viewtitle').textContent=v.name;$('#draftmark').textContent=v.draft?'团队草稿':'已发布';$('#renderer').value=config.renderer;$('#density').value=config.density;$('#group').value=config.group;$('#columnLabel').value=config.columns[0].label;$('#columnWidth').value=config.columns[0].width;$('#draft').disabled=!manager();$('#publish').disabled=!manager()||!v.draft;$('#restore').disabled=!manager();$('#privacy').textContent=manager()?'团队草稿需要发布后才对其他成员生效。':'当前账号可保存个人视图；团队发布由主管操作。';preview();}
function preview(){const examples=[{title:'秋季活动主视觉',assignee:'许知',owner:'林可',due:'10月22日',status:'制作中',kind:'设计',scheduleTag:'queue4'},{title:'新品详情页升级',assignee:'周然',owner:'林可',due:'10月23日',status:'待认领',kind:'美工',scheduleTag:'urgent'},{title:'店铺活动入口',assignee:'许知',owner:'林可',due:'10月24日',status:'待审核',kind:'设计',scheduleTag:'idle'}];if(config.renderer==='board'){$('#preview').innerHTML='<div class="board">'+book.options.slice(0,3).map(o=>'<div class="lane"><strong>'+esc(o.label)+'</strong>'+examples.filter(t=>t.scheduleTag===o.id).map(t=>'<div class="card">'+esc(t.title)+'<small>'+esc(t.assignee)+' · '+esc(t.status)+'</small></div>').join('')+'</div>').join('')+'</div>';return;}const cols=config.columns.filter(c=>c.visible);$('#preview').innerHTML='<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th style="min-width:'+c.width+'px">'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+examples.map(t=>'<tr>'+cols.map(c=>'<td>'+esc(c.id==='scheduleTag'?book.options.find(o=>o.id===t[c.id])?.label:t[c.id]||'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
for(const name of ['renderer','density','group'])$('#'+name).onchange=()=>{config[name]=$('#'+name).value;preview();};$('#columnLabel').oninput=()=>{config.columns[0].label=$('#columnLabel').value;preview();};$('#columnWidth').onchange=()=>{config.columns[0].width=Number($('#columnWidth').value);preview();};
async function command(action,version){const v=await api('/v1/scheduling/commands',{commandId:crypto.randomUUID(),teamId:team,expectedVersion:version,reason:$('#reason').value,action});if(v.workbook){book=v.workbook;loadedVersion=book.version;render();}if(v.personal)personalVersion=v.personal.version;await audit();return v;}
function run(fn){return async()=>{try{await fn();}catch(e){const text=e.message==='VERSION_CONFLICT'?'版本冲突：服务端已有新修改。当前编辑保留，请先重新载入再合并。':e.message;status(text,true);}};}
$('#draft').onclick=run(async()=>{await command({type:'save-draft',viewId,baseRevision:current().revision,config},loadedVersion);status('团队草稿已入库，其他成员仍看到已发布版本。');});
$('#publish').onclick=run(async()=>{await command({type:'publish-view',viewId,baseRevision:current().revision},loadedVersion);status('团队模板已发布 · 视图 v'+current().revision);});
$('#personal').onclick=run(async()=>{await command({type:'save-personal',viewId,baseRevision:current().revision,config},personalVersion);status('我的视图已入库 · 个人版本 v'+personalVersion+'，其他成员保持不变。');});
$('#restore').onclick=run(async()=>{await command({type:'restore-view',viewId,revision:1},loadedVersion);config=structuredClone(current().published);render();status('初始布局已恢复为新版本 v'+current().revision+'，历史记录保留。');});
async function audit(){if(!manager()){$('#audit').innerHTML='<div class="blank">团队审计由主管查看；个人配置保持隔离。</div>';return;}const a=(await api('/v1/teams/TEAM/scheduling/audit')).events;const names={'initialize':'初始化','save-draft':'保存团队草稿','publish-view':'发布团队模板','restore-view':'恢复布局','save-personal':'保存我的视图'};$('#audit').innerHTML='<div class="scroll"><table><thead><tr><th>操作</th><th>人员</th><th>版本</th><th>原因</th><th>时间</th></tr></thead><tbody>'+a.map(e=>'<tr><td>'+esc(names[e.operation]||e.operation)+'</td><td>'+esc(e.subject)+'</td><td>v'+e.revision+'</td><td>'+esc(e.detail.reason)+'</td><td>'+new Date(e.created_at).toLocaleTimeString('zh-CN')+'</td></tr>').join('')+'</tbody></table></div>';}
$('#reload').onclick=load;$('#identity').onchange=()=>{sessionStorage.setItem('schedule-fixture-user',$('#identity').value);load();};load();
</script></body></html>
